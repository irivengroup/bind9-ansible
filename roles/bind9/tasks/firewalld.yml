---
- name: Validate firewall inputs
  ansible.builtin.assert:
    that:
      - bind_firewalld_front_zone != bind_firewalld_back_zone
      - bind_firewalld_front_clients | length > 0
      - bind_firewalld_primary_back_ip | length > 0
      - bind_firewalld_secondary_back_ip | length > 0
    fail_msg: "Configure distinct front/back zones and valid peer IPs."

- name: Install firewalld
  ansible.builtin.dnf:
    name: [firewalld, python3-firewall]
    state: present

- name: Start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Optionally create dedicated firewall zones
  ansible.posix.firewalld:
    zone: "{{ item }}"
    state: present
    permanent: true
  loop:
    - "{{ bind_firewalld_front_zone }}"
    - "{{ bind_firewalld_back_zone }}"
  when: bind_firewalld_manage_zones | bool
  notify: Reload firewalld

- name: Ensure zones are available before applying rules
  ansible.builtin.meta: flush_handlers

- name: Inspect current interface firewall zones
  ansible.builtin.command:
    argv: [firewall-cmd, --get-zone-of-interface, "{{ item }}"]
  loop: ["{{ bind_front_interface }}", "{{ bind_back_interface }}"]
  register: bind_fw_interfaces
  changed_when: false
  failed_when: false

- name: Prevent accidental firewall policy changes on wrong interfaces
  ansible.builtin.assert:
    that:
      - bind_fw_interfaces.results[0].stdout | trim == bind_firewalld_front_zone
      - bind_fw_interfaces.results[1].stdout | trim == bind_firewalld_back_zone
    fail_msg: >-
      Assign interfaces to their firewall zones beforehand using NetworkManager;
      this role never moves interfaces, protecting existing SSH access.

# Negative priorities ensure these rules take precedence over ordinary zone services.
# Destination address prevents applying the DNS restrictions to other interfaces in the zone.
- name: Allow approved external DNS clients on front
  ansible.posix.firewalld:
    zone: "{{ bind_firewalld_front_zone }}"
    rich_rule: >-
      rule priority="-200" family="ipv4" source address="{{ item.0 }}"
      destination address="{{ bind_front_ip }}" port port="53"
      protocol="{{ item.1 }}" accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ bind_firewalld_front_clients | product(['tcp', 'udp']) | list }}"

- name: Deny other inbound DNS clients on front
  ansible.posix.firewalld:
    zone: "{{ bind_firewalld_front_zone }}"
    rich_rule: >-
      rule priority="-100" family="ipv4" destination address="{{ bind_front_ip }}"
      port port="53" protocol="{{ item }}" drop
    permanent: true
    immediate: true
    state: enabled
  loop: [tcp, udp]

- name: Allow AXFR and IXFR requests from secondary to primary over back
  ansible.posix.firewalld:
    zone: "{{ bind_firewalld_back_zone }}"
    rich_rule: >-
      rule priority="-200" family="ipv4"
      source address="{{ bind_firewalld_secondary_back_ip }}"
      destination address="{{ bind_back_ip }}"
      port port="53" protocol="tcp" accept
    permanent: true
    immediate: true
    state: enabled
  when: bind_role == 'primary'

- name: Allow NOTIFY from primary to secondary over back
  ansible.posix.firewalld:
    zone: "{{ bind_firewalld_back_zone }}"
    rich_rule: >-
      rule priority="-200" family="ipv4"
      source address="{{ bind_firewalld_primary_back_ip }}"
      destination address="{{ bind_back_ip }}"
      port port="53" protocol="udp" accept
    permanent: true
    immediate: true
    state: enabled
  when: bind_role == 'secondary'

- name: Deny all other incoming DNS traffic on back
  ansible.posix.firewalld:
    zone: "{{ bind_firewalld_back_zone }}"
    rich_rule: >-
      rule priority="-100" family="ipv4" destination address="{{ bind_back_ip }}"
      port port="53" protocol="{{ item }}" drop
    permanent: true
    immediate: true
    state: enabled
  loop: [tcp, udp]
