---
- name: Install local DNS healthcheck
  ansible.builtin.copy:
    src: healthcheck
    dest: /usr/local/sbin/named-healthcheck
    owner: root
    group: root
    mode: '0750'

- name: Install healthcheck service
  ansible.builtin.template:
    src: named-healthcheck.service.j2
    dest: /etc/systemd/system/named-healthcheck.service
    owner: root
    group: root
    mode: '0644'

- name: Install healthcheck timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=named DNS health check timer
      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=1min
      AccuracySec=10s
      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/named-healthcheck.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable periodic healthcheck
  ansible.builtin.systemd:
    name: named-healthcheck.timer
    enabled: true
    state: started
    daemon_reload: true
