---
- name: Enable and start named
  ansible.builtin.systemd:
    name: named
    enabled: true
    state: started
    daemon_reload: true
- name: Apply validated BIND changes
  ansible.builtin.meta: flush_handlers
- name: Check named is active
  ansible.builtin.command:
    argv: [systemctl, is-active, named]
  register: bind_service_active
  changed_when: false
  failed_when: bind_service_active.stdout | trim != 'active'
