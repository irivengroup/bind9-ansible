---
- name: Inspect managed BIND paths without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /etc/named.conf
    - /etc/named
    - /etc/named/zones
    - /etc/named/10-tsig.conf
    - /etc/named/20-acl.conf
    - /etc/named/30-options.conf
    - /etc/named/40-views.conf
    - /etc/named/zones/10-authoritative-zones.conf
    - /etc/named/zones/15-external-authoritative-zones.conf
    - /etc/named/zones/16-internal-authoritative-zones.conf
    - /etc/named/zones/20-forward-zones.conf
    - /var/named
    - /var/named/zones
    - /var/named/slaves
  register: bind_managed_paths
  changed_when: false

- name: Refuse symlinks and non-regular managed files
  ansible.builtin.assert:
    that:
      - not item.stat.islnk | default(false)
      - not item.stat.exists or item.stat.isreg | default(false) or item.stat.isdir | default(false)
    fail_msg: "Unsafe BIND managed path: {{ item.item }}"
  loop: "{{ bind_managed_paths.results }}"
  loop_control:
    label: "{{ item.item }}"
