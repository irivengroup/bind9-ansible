---
# Keep source authorization separate from FRONT route destinations. Validate
# both lists before concatenation, including when only a partial tag is used.
- name: Validate the cloud and internal client list types
  ansible.builtin.assert:
    that:
      - bind_trusted_networks is mapping
      - bind_trusted_networks.keys() | difference(['cloud_clients', 'internal_clients']) | length == 0
      - (bind_trusted_networks.cloud_clients | default([])) is sequence and (bind_trusted_networks.cloud_clients | default([])) is not string and (bind_trusted_networks.cloud_clients | default([])) is not mapping
      - (bind_trusted_networks.internal_clients | default([])) is sequence and (bind_trusted_networks.internal_clients | default([])) is not string and (bind_trusted_networks.internal_clients | default([])) is not mapping
    fail_msg: 'bind_trusted_networks must be a mapping containing only cloud_clients and internal_clients, each a flat list of IPv4 addresses or canonical CIDRs.'

- name: Require at least one configured DNS client network
  ansible.builtin.assert:
    that:
      - (bind_trusted_networks.cloud_clients | default([]) | length > 0) or (bind_trusted_networks.internal_clients | default([]) | length > 0)
    fail_msg: 'bind_trusted_networks.cloud_clients and bind_trusted_networks.internal_clients cannot both be empty.'

- name: Validate cloud and internal client IPv4 entries
  ansible.builtin.assert:
    that:
      - item is string
      - item | valid_client_address
      - item | dns_client_safe
    fail_msg: 'Client entries must be safe unicast IPv4 addresses or canonical non-default IPv4 CIDRs.'
  loop: '{{ (bind_trusted_networks.cloud_clients | default([])) + (bind_trusted_networks.internal_clients | default([])) }}'
  loop_control:
    label: '{{ item | string }}'

- name: Compute the unique union used by DNS authorization
  ansible.builtin.set_fact:
    bind_allowed_clients: '{{ ((bind_trusted_networks.cloud_clients | default([])) + (bind_trusted_networks.internal_clients | default([]))) | unique | list }}'

- name: Reject an override that bypasses the computed client union
  ansible.builtin.assert:
    that:
      - bind_allowed_clients == (((bind_trusted_networks.cloud_clients | default([])) + (bind_trusted_networks.internal_clients | default([]))) | unique | list)
    fail_msg: 'bind_allowed_clients is computed from cloud and internal inputs and must not be overridden.'
