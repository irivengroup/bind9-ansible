---
- name: Check generated BIND configuration and authoritative zones
  ansible.builtin.command:
    argv: [/usr/sbin/named-checkconf, -z, /etc/named.conf]
  changed_when: false

- name: Check named configuration contains no insecure transfer ACL
  ansible.builtin.command:
    argv: [/usr/sbin/named-checkconf, -p, /etc/named.conf]
  register: bind_checked_configuration
  changed_when: false
  no_log: true

- name: Ensure no wildcard zone transfers are enabled
  # BIND prints ACLs on several lines and quotes built-ins such as "any".
  ansible.builtin.assert:
    that:
      - >-
        bind_checked_configuration.stdout is not search('allow-transfer\s*[{]\s*(?:any|"any")\s*;')
  no_log: true

- name: Verify each generated authoritative zone independently
  ansible.builtin.command:
    argv:
      - /usr/sbin/named-checkzone
      - "{{ item.domain }}"
      - "/var/named/zones/{{ item.domain }}.zone"
  loop: "{{ bind_managed_zones }}"
  loop_control:
    label: "{{ item.domain }}"
  when: "bind_primary_group in group_names"
  changed_when: false
