---
- name: Validate template input types before rendering
  ansible.builtin.assert:
    that:
      - bind_authoritative_zones is not defined or (bind_authoritative_zones is sequence and bind_authoritative_zones is not string and bind_authoritative_zones is not mapping)
      - bind_forward_zones is not defined or (bind_forward_zones is sequence and bind_forward_zones is not string and bind_forward_zones is not mapping)
      - bind_allowed_clients is sequence and bind_allowed_clients is not string and bind_allowed_clients is not mapping
      - bind_tsig_key_name is defined and (bind_tsig_key_name | default('') | string | trim | length > 0)
      - bind_tsig_algorithm is defined and (bind_tsig_algorithm | default('') | string | trim | length > 0)
      - bind_tsig_secret is defined and (bind_tsig_secret | default('') | string | trim | length >= 32)
      - bind_front_ip is defined and (bind_front_ip | default('') | string | trim | length > 0)
      - bind_back_ip is defined and (bind_back_ip | default('') | string | trim | length > 0)
    fail_msg: 'Template inputs must be correctly typed and mandatory DNS/TSIG values must be nonempty.'
  no_log: true

- name: Validate literal service addresses and TSIG material before interpolation
  ansible.builtin.assert:
    that:
      - bind_front_ip | dns_identity_valid(bind_back_ip, bind_tsig_key_name, bind_tsig_algorithm, bind_tsig_secret)
    fail_msg: 'FRONT/BACK must be distinct unicast IPv4 addresses; TSIG requires a safe name, SHA-256 algorithm and a canonical secret of at least 256 bits.'
  no_log: true

- name: Validate supported platform and mandatory inputs
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'RedHat'
      - (ansible_distribution_major_version | int) >= 8
      - ((bind_primary_group in group_names) | int) + ((bind_secondary_group in group_names) | int) == 1
      - bind_front_ip is defined
      - bind_back_ip is defined
      - ansible_host is defined
      - ansible_host != bind_back_ip
      - ansible_host != bind_front_ip
      - bind_front_ip != bind_back_ip
      - bind_tsig_secret | length >= 32
      - bind_allowed_clients is sequence
      - bind_forward_zones is sequence
      - bind_authoritative_zones is sequence
      - hostvars[bind_primary_host].bind_back_ip != hostvars[bind_secondary_host].bind_back_ip
      - ((bind_managed_zones) | map(attribute='domain') | list | unique | length) == ((bind_managed_zones) | length)
      - ((bind_managed_zones) | map(attribute='domain') | list | intersect(bind_forward_zones | map(attribute='domain') | list) | length) == 0
      - hostvars[bind_primary_host].bind_front_ip is defined
      - hostvars[bind_secondary_host].bind_front_ip is defined
      - hostvars[bind_primary_host].bind_front_ip | valid_ip_address
      - hostvars[bind_secondary_host].bind_front_ip | valid_ip_address
      - hostvars[bind_primary_host].bind_back_ip | valid_ip_address
      - hostvars[bind_secondary_host].bind_back_ip | valid_ip_address
      - (bind_forward_zones | map(attribute='domain') | list | unique | length) == (bind_forward_zones | length)
    fail_msg: 'Invalid RHEL 8+ BIND settings, zone overlap or TSIG secret.'
  no_log: true
- name: Validate configured peer identity
  ansible.builtin.assert:
    that:
      - ((bind_primary_group in group_names) and bind_back_ip == hostvars[bind_primary_host].bind_back_ip) or ((bind_secondary_group in group_names) and bind_back_ip == hostvars[bind_secondary_host].bind_back_ip)
    fail_msg: 'Local back address does not match declared DNS role.'

- name: Keep the administrative RNDC key separate from site transfers
  ansible.builtin.assert:
    that: [bind_tsig_key_name | lower != 'rndc-key']
    fail_msg: 'bind_tsig_key_name must not reuse the vendor administrative rndc-key name.'

- name: Validate each conditional forwarding zone
  ansible.builtin.assert:
    that:
      - item.domain is defined
      - item.domain | length > 0
      - item.domain != '.'
      - "'*' not in item.domain"
      - item.policy | default('only') == 'only'
      - item.forwarders is defined
      - item.forwarders | length > 0
    fail_msg: 'Invalid forwarding zone; use domain, forwarders and policy only.'
  loop: "{{ bind_forward_zones }}"
  loop_control:
    label: "{{ item.domain | default('undefined') }}"

- name: Validate each forwarding destination
  ansible.builtin.assert:
    that:
      - item.1.address is defined
      - item.1.address | length > 0
      - item.1.address | valid_ip_address
      - item.1 | dns_forwarder_safe
      - >-
        (item.1.port | default(53) | int) != 53 or item.1.address not in
        [bind_front_ip, bind_back_ip, '127.0.0.1',
        hostvars[bind_primary_host].bind_front_ip, hostvars[bind_primary_host].bind_back_ip,
        hostvars[bind_secondary_host].bind_front_ip, hostvars[bind_secondary_host].bind_back_ip]
      - item.1.port | default(53) | int >= 1
      - item.1.port | default(53) | int <= 65535
    fail_msg: 'Invalid forwarding server address or port.'
  loop: "{{ bind_forward_zones | subelements('forwarders') }}"
  loop_control:
    label: "{{ item.0.domain }}"

- name: Reject overlapping conditional DNS suffixes
  ansible.builtin.assert:
    that:
      - >-
        (bind_forward_zones | selectattr('domain', 'equalto', item.domain) | list | length) == 1
      - >-
        (bind_forward_zones | rejectattr('domain', 'equalto', item.domain)
        | selectattr('domain', 'match', '.*') | map(attribute='domain')
        | select('search', '\.' ~ (item.domain | regex_escape) ~ '$') | list | length) == 0
    fail_msg: 'Nested conditional zones require explicit review; avoid ambiguous DNS routing.'
  loop: "{{ bind_forward_zones }}"
  loop_control:
    label: "{{ item.domain }}"

- name: Reject malformed DNS suffixes
  ansible.builtin.assert:
    that:
      - item.domain is match('(?i)^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z][a-z0-9-]{1,62}$')
    fail_msg: 'Forward zone must be a syntactically valid DNS suffix.'
  loop: "{{ bind_forward_zones }}"
  loop_control:
    label: "{{ item.domain }}"

- name: Validate authoritative zone definitions
  ansible.builtin.assert:
    that:
      - item.domain is match('(?i)^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z][a-z0-9-]{1,62}$')
      - item.serial is defined
      - item.serial | string is match('^[0-9]{1,10}$')
      - item.serial | int > 0
      - item.serial | int <= 4294967295
      - item.ttl | default(300) | int >= 0
      - item.records | default([]) is sequence
      - "'*' not in item.domain"
    fail_msg: 'Invalid authoritative zone definition.'
  loop: "{{ bind_managed_zones }}"
  loop_control:
    label: "{{ item.domain }}"

- name: Validate DNS topology and private forwarding delegation cuts
  ansible.builtin.assert:
    that:
      - bind_managed_zones | dns_topology_valid(bind_forward_zones)
    fail_msg: 'Invalid DNS topology: native zone collision, hidden authoritative data or ambiguous forwarding.'

- name: Validate authoritative resource records
  ansible.builtin.assert:
    that:
      - item.1.name is match('(?i)^(?:@|\*|[a-z0-9_-]+(?:\.[a-z0-9_-]+)*)$')
      - item.1.type in ['A', 'AAAA', 'CNAME', 'TXT', 'MX', 'PTR', 'SRV', 'CAA']
      - item.1.value is defined
      - item.1.value | string | length > 0
      - item.1 | valid_dns_record
      - "'\n' not in item.1.value | string"
    fail_msg: 'Invalid DNS resource record.'
  loop: "{{ (bind_managed_zones) | subelements('records', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.domain }} / {{ item.1.name }}"

- name: Validate reverse network input and generated zone collisions
  ansible.builtin.assert:
    that:
      - (bind_managed_zones | map(attribute='domain') | list | unique | length) == (bind_managed_zones | length)
      - (bind_managed_zones | map(attribute='domain') | list | intersect(bind_forward_zones | map(attribute='domain') | list) | length) == 0
    fail_msg: 'Automatically generated reverse zone conflicts with an existing zone.'

- name: Reject explicit reverse masks in authoritative records
  ansible.builtin.assert:
    that:
      - "'mask' not in item.1"
    fail_msg: 'Per-record mask is unsupported; automatic reverse zones use IPv4 /24 and IPv6 /64.'
  loop: "{{ bind_authoritative_zones | subelements('records', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.domain }} / {{ item.1.name | default('undefined') }}"
