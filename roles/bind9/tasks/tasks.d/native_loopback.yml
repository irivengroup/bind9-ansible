---
# The package is the source of truth: inspect its files, never template them.
- name: Inspect distribution-owned localhost configuration and zone data
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - /etc/named.rfc1912.zones
    - /var/named/named.localhost
    - /var/named/named.loopback
    - /var/named/named.empty
  register: bind_native_loopback_files

- name: Require native BIND files without replacing missing or unsafe files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - >-
        (item.stat.isreg | default(false)) or
        ((item.item | dirname) == '/var/named' and
         (item.stat.islnk | default(false)) and item.stat.uid == 0 and
         [item.stat.lnk_target, item.stat.lnk_source] ==
         ['../../usr/share/named/' ~ (item.item | basename),
          '/usr/share/named/' ~ (item.item | basename)])
    fail_msg: 'Native BIND file missing or unsafe: {{ item.item }}. Repair the RHEL bind package; the role does not replace vendor files.'
  loop: '{{ bind_native_loopback_files.results }}'
  loop_control:
    label: '{{ item.item }}'

# Recent bind RPMs place the immutable loopback data under /usr/share/named.
# Inspect both the directory and the target inodes of the approved links.
- name: Inspect approved native BIND link targets and their directory
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  vars:
    bind_native_link_targets: >-
      {{ bind_native_loopback_files.results | selectattr('stat.lnk_source', 'defined')
         | map(attribute='stat.lnk_source') | list }}
  loop: "{{ ['/usr/share/named'] + bind_native_link_targets if bind_native_link_targets else [] }}"
  register: bind_native_link_target_files

- name: Require protected native BIND link targets
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat['isdir' if item.item == '/usr/share/named' else 'isreg'] | default(false)
      - item.stat.uid == 0
      - not item.stat.wgrp
      - not item.stat.woth
    fail_msg: 'Native BIND link target missing or unsafe: {{ item.item }}. Repair the installed bind package.'
  loop: '{{ bind_native_link_target_files.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Inspect native system crypto-policy include
  # System-wide crypto-policies are supplied by EL8 and newer releases.
  ansible.builtin.stat:
    path: '{{ item }}'
    # crypto-policies can install a symlink to the selected vendor policy.
    follow: true
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - /etc/crypto-policies/back-ends/bind.config
  register: bind_native_security_files
  when: ansible_distribution_major_version | default('8') | int >= 8

- name: Require native crypto-policy include
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
    fail_msg: 'Required system crypto-policy include is missing: {{ item.item }}. Repair the vendor package or crypto-policy; the role does not generate a fallback.'
  loop: '{{ bind_native_security_files.results | default([]) }}'
  loop_control:
    label: '{{ item.item }}'
  when: ansible_distribution_major_version | default('8') | int >= 8

- name: Inspect the native trust anchor only when validation is enabled
  ansible.builtin.stat:
    path: /etc/named.root.key
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: bind_native_trust_anchor
  when: bind_dnssec_active == 'auto' or (bind_dnssec_active | bool)

- name: Require the native trust anchor for enabled DNSSEC modes
  ansible.builtin.assert:
    that:
      - bind_native_trust_anchor.stat.exists
      - not (bind_native_trust_anchor.stat.islnk | default(false))
      - bind_native_trust_anchor.stat.isreg | default(false)
    fail_msg: 'Enabled DNSSEC requires the native /etc/named.root.key file.'
  when: bind_dnssec_active == 'auto' or (bind_dnssec_active | bool)
