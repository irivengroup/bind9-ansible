---
- name: Create protected BIND backup directory
  ansible.builtin.file:
    path: "{{ bind_backup_root }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install BIND backup and snapshot utility
  ansible.builtin.copy:
    src: bind-backup.sh
    dest: /usr/local/sbin/bind-backup.sh
    owner: root
    group: root
    mode: '0700'

- name: Back up full BIND configuration before any changes
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/bind-backup.sh
      - backup
      - --root
      - "{{ bind_backup_root }}"
  register: bind_snapshot_result
  changed_when: "'BACKUP_CREATED' in bind_snapshot_result.stdout"
