---
- name: Validate TSIG site settings
  ansible.builtin.assert:
    that:
      - bind_tsig_key_name is match('^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$')
      - bind_tsig_algorithm == 'hmac-sha256'
      - bind_tsig_secret_file is match('^/')
      - bind_tsig_secret_file != '/etc/named.conf'
    fail_msg: 'Invalid TSIG key name, algorithm or controller secret path.'

- name: Generate or verify persistent site TSIG secret atomically on controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/tsig-secret.py"
      - "{{ bind_tsig_secret_file }}"
      - --create-parent
  register: bind_tsig_provision
  changed_when: (bind_tsig_provision.stdout | default('')) == 'CREATED'
  delegate_to: localhost
  become: false
  no_log: true

- name: Set shared site TSIG identity and secret
  ansible.builtin.set_fact:
    bind_tsig_secret: "{{ lookup('ansible.builtin.file', bind_tsig_secret_file) | trim }}"
  no_log: true
