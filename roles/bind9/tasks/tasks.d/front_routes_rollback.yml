---
# Remove only entries that were absent in the persisted pre-operation snapshot.
# command rc is handled explicitly: absent entries are possible after a partial
# operation, but every other error is fatal and preserves the recovery journal.
- name: Record that selective FRONT rollback was attempted
  ansible.builtin.set_fact:
    bind_front_route_rollback_attempted: true

- name: Validate route journal before selecting owned removals
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_validate_journal.yml'

- name: Inspect active FRONT identity before rollback
  ansible.builtin.command:
    argv: [nmcli, -g, GENERAL.CON-UUID, device, show, '{{ bind_front_plan.device }}']
  environment: {LC_ALL: C}
  register: bind_front_rollback_uuid
  changed_when: false
  failed_when: bind_front_rollback_uuid.rc != 0 or (bind_front_rollback_uuid.stdout | trim) != bind_front_plan.uuid

- name: Read the existing FRONT gateway before any rollback mutation
  ansible.builtin.command:
    argv: [nmcli, -g, ipv4.gateway, connection, show, uuid, '{{ bind_front_plan.uuid }}']
  environment: {LC_ALL: C}
  register: bind_front_rollback_gateway
  changed_when: false
  failed_when: bind_front_rollback_gateway.rc != 0 or bind_front_rollback_gateway.stdout | trim != bind_front_plan.gateway

- name: Read current policy rules before any rollback mutation
  ansible.builtin.command:
    argv: [ip, -j, -4, rule, show]
  register: bind_front_rollback_rules
  changed_when: false

- name: Refuse policy drift before removing any FRONT route
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_policy.yml'
  vars:
    bind_front_rule_observation: '{{ bind_front_rollback_rules.stdout }}'

- name: Read the actual SSH peer before route recovery
  ansible.builtin.command:
    argv: [printenv, SSH_CONNECTION]
  become: false
  register: bind_front_recovery_ssh
  changed_when: false
  failed_when: bind_front_recovery_ssh.rc != 0 or (bind_front_recovery_ssh.stdout.split() | length) != 4
  when: ansible_connection | default('ssh') != 'local'

- name: Record the current SSH source for recovery protection
  ansible.builtin.set_fact:
    bind_front_ssh_client: '{{ bind_front_recovery_ssh.stdout.split()[0] if ansible_connection | default("ssh") != "local" else "" }}'

- name: Normalize the current SSH peer before owned route removal
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_ssh_normalize.yml'

- name: Normalize current inventory and SSH addresses for recovery protection
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_ipv4.yml'
  vars:
    bind_front_ipv4_context: 'current inventory and SSH source during FRONT rollback'
    bind_front_ipv4_values: >-
      {{ ([ansible_host, bind_front_ip, bind_back_ip,
          hostvars[bind_primary_host].bind_back_ip, hostvars[bind_secondary_host].bind_back_ip] +
         ([bind_front_ssh_ipv4] if bind_front_ssh_ipv4 else [])) | to_json }}

- name: Refuse owned routes that cover current administrative or DNS addresses
  ansible.builtin.assert:
    that:
      - not (bind_front_ipv4_data[item.1].lo <= bind_front_ipv4_data[item.0.split()[0]].hi and bind_front_ipv4_data[item.1].hi >= bind_front_ipv4_data[item.0.split()[0]].lo)
    fail_msg: 'Recovery would affect a current ADM, FRONT, BACK or SSH address; no route removals were started.'
  loop: >-
    {{ (bind_front_plan.profile_additions + bind_front_plan.runtime_additions) | product(
       [ansible_host, bind_front_ip, bind_back_ip, hostvars[bind_primary_host].bind_back_ip,
        hostvars[bind_secondary_host].bind_back_ip] + ([bind_front_ssh_ipv4] if bind_front_ssh_ipv4 else [])) | list }}

- name: Read persistent routes available for selective rollback
  ansible.builtin.command:
    argv: [nmcli, -g, ipv4.routes, connection, show, uuid, '{{ bind_front_plan.uuid }}']
  environment: {LC_ALL: C}
  register: bind_front_rollback_profile
  changed_when: false

- name: Parse persistent routes before selecting owned removals
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_parse_profile.yml'
  vars:
    bind_front_routes_text: '{{ bind_front_rollback_profile.stdout }}'

- name: Select exact owned persistent additions with native expressions
  ansible.builtin.set_fact:
    bind_front_profile_selection: >-
      {%- set ns = namespace(routes=[], errors=[]) -%}
      {%- for entry in bind_front_plan.profile_additions -%}
        {%- set parts = entry.split() -%}
        {%- set matching = bind_front_parsed_profile | selectattr('network', 'equalto', parts[0]) | list -%}
        {%- set expected = {'network':parts[0], 'gateway':parts[1], 'metric':(parts[2] | int) if parts | length == 3 else -1, 'attributes':{}} -%}
        {%- if matching and matching != [expected] -%}
          {%- set ns.errors = ns.errors + ['Owned persistent route identity changed; manual recovery required'] -%}
        {%- elif matching -%}{%- set ns.routes = ns.routes + [entry] -%}{%- endif -%}
      {%- endfor -%}
      {{ {'routes':ns.routes, 'errors':ns.errors} | to_json }}

- name: Refuse removal of a modified persistent route
  ansible.builtin.assert:
    that: [((bind_front_profile_selection | from_json if bind_front_profile_selection is string else bind_front_profile_selection)).errors | length == 0]
    fail_msg: '{{ ((bind_front_profile_selection | from_json if bind_front_profile_selection is string else bind_front_profile_selection)).errors }}'

- name: Read runtime routes available for selective rollback
  ansible.builtin.command:
    argv: [ip, -j, -4, route, show, table, main]
  register: bind_front_rollback_kernel
  changed_when: false

- name: Normalize active destinations being inspected
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_ipv4.yml'
  vars:
    bind_front_ipv4_context: 'ip -j -4 route show table main during rollback'
    bind_front_ipv4_values: >-
      {%- set ns = namespace(values=[]) -%}
      {%- for route in bind_front_rollback_kernel.stdout | from_json -%}
        {%- set ns.values = ns.values + [route.get('dst','default') | replace('default','0.0.0.0/0')] -%}
      {%- endfor -%}
      {{ ns.values | to_json }}

- name: Select exact owned active additions with native expressions
  ansible.builtin.set_fact:
    bind_front_runtime_selection: >-
      {%- set ns = namespace(routes=[], errors=[]) -%}
      {%- for entry in bind_front_plan.runtime_additions -%}
        {%- set parts = entry.split() -%}
        {%- set row = namespace(matching=[]) -%}
        {%- for route in bind_front_rollback_kernel.stdout | from_json -%}
          {%- if (bind_front_ipv4_data[route.get('dst','default') | replace('default','0.0.0.0/0')].cidr) == parts[0] -%}
            {%- set row.matching = row.matching + [route] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if row.matching -%}
          {%- if row.matching | length != 1 or row.matching[0].get('dev') != bind_front_plan.device or row.matching[0].get('gateway') != parts[1] or
              row.matching[0].get('type','unicast') != 'unicast' or
              (row.matching[0].keys() | list | difference(['dst','gateway','dev','metric','protocol','scope','flags','type','table'])) or
              row.matching[0].get('flags',[]) != [] or row.matching[0].get('table','main') not in ['main',254,'254'] or
              row.matching[0].get('protocol','boot') not in ['boot','static',3,4] or
              row.matching[0].get('scope','global') not in ['global','universe',0] or
              row.matching[0].get('metric',0) != ((parts[2] | int) if parts | length == 3 else 0) -%}
            {%- set ns.errors = ns.errors + ['Owned active route identity changed; manual recovery required'] -%}
          {%- else -%}{%- set ns.routes = ns.routes + [entry] -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'routes':ns.routes, 'errors':ns.errors} | to_json }}

- name: Refuse removal of a modified active route
  ansible.builtin.assert:
    that: [((bind_front_runtime_selection | from_json if bind_front_runtime_selection is string else bind_front_runtime_selection)).errors | length == 0]
    fail_msg: '{{ ((bind_front_runtime_selection | from_json if bind_front_runtime_selection is string else bind_front_runtime_selection)).errors }}'

- name: Remove owned persistent additions
  ansible.builtin.command:
    argv: [nmcli, --wait, '10', connection, modify, uuid, '{{ bind_front_plan.uuid }}', -ipv4.routes, '{{ item }}']
  environment: {LC_ALL: C}
  loop: '{{ ((bind_front_profile_selection | from_json if bind_front_profile_selection is string else bind_front_profile_selection)).routes }}'

- name: Remove owned active additions
  ansible.builtin.command:
    argv: >-
      {{ ['ip', '-4', 'route', 'del', item.split()[0], 'via', item.split()[1], 'dev', bind_front_plan.device] +
         (['metric', item.split()[2]] if item.split() | length == 3 else []) + ['table', 'main'] }}
  environment: {LC_ALL: C}
  loop: '{{ ((bind_front_runtime_selection | from_json if bind_front_runtime_selection is string else bind_front_runtime_selection)).routes }}'

- name: Read restored profile and main table
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [nmcli, -g, ipv4.routes, connection, show, uuid, '{{ bind_front_plan.uuid }}']
    - [ip, -j, -4, route, show, table, main]
  environment: {LC_ALL: C}
  register: bind_front_restored
  changed_when: false

- name: Require the exact original routing state
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_compare.yml'
  vars:
    bind_front_compare_profile: '{{ bind_front_restored.results[0].stdout }}'
    bind_front_compare_runtime: '{{ bind_front_restored.results[1].stdout }}'
    bind_front_compare_applied: false

- name: Remove the recovery journal after successful rollback
  ansible.builtin.file:
    path: /var/lib/Bind9-Ansible/front-routes.lock
    state: absent

- name: Mark owned FRONT additions completely rolled back
  ansible.builtin.set_fact:
    bind_front_route_transaction_pending: false
