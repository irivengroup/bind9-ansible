---
# Compare snapshots and exact intended additions, not command stdout/changed.
- name: Parse the persistent routes being verified
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_parse_profile.yml'
  vars:
    bind_front_routes_text: '{{ bind_front_compare_profile }}'

- name: Normalize active destinations being inspected
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/front_routes_ipv4.yml'
  vars:
    bind_front_ipv4_values: >-
      {%- set ns = namespace(values=[]) -%}
      {%- for route in (bind_front_compare_runtime | from_json if bind_front_compare_runtime is string else bind_front_compare_runtime) -%}
        {%- set ns.values = ns.values + [route.get('dst','default') | replace('default','0.0.0.0/0')] -%}
      {%- endfor -%}
      {{ ns.values }}

- name: Compute exact routing preservation diagnostics
  ansible.builtin.set_fact:
    bind_front_comparison_json: >-
      {%- set ns = namespace(errors=[], expected=bind_front_plan.profile_before) -%}
      {%- set runtime = (bind_front_compare_runtime | from_json if bind_front_compare_runtime is string else bind_front_compare_runtime) -%}
      {%- if bind_front_compare_applied | bool -%}
        {%- for entry in bind_front_plan.profile_additions -%}
          {%- set parts = entry.split() -%}
          {%- set ns.expected = ns.expected + [{'network':parts[0], 'gateway':parts[1], 'metric':(parts[2] | int) if parts | length == 3 else -1, 'attributes':{}}] -%}
        {%- endfor -%}
      {%- endif -%}
      {%- if (ns.expected | map('to_json', sort_keys=true) | list | sort) != (bind_front_parsed_profile | map('to_json', sort_keys=true) | list | sort) -%}
        {%- set ns.errors = ns.errors + ['Persistent route state differs from the exact additive plan'] -%}
      {%- endif -%}
      {%- if bind_front_plan.runtime_before | difference(runtime) | length > 0 -%}
        {%- set ns.errors = ns.errors + ['A preexisting route/default changed or disappeared'] -%}
      {%- endif -%}
      {%- for route in runtime | difference(bind_front_plan.runtime_before) -%}
        {%- set row = namespace(allowed=false) -%}
        {%- for entry in bind_front_plan.runtime_additions if bind_front_compare_applied | bool -%}
          {%- set parts = entry.split() -%}
          {%- if (bind_front_ipv4_data[route.get('dst','default') | replace('default','0.0.0.0/0')].cidr) == parts[0] and route.get('dev') == bind_front_plan.device and route.get('gateway') == parts[1] -%}
            {%- set row.allowed = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if not row.allowed -%}{%- set ns.errors = ns.errors + ['An unrelated active route appeared'] -%}{%- endif -%}
      {%- endfor -%}
      {%- if bind_front_compare_applied | bool -%}
        {%- for entry in bind_front_plan.runtime_additions -%}
          {%- set parts = entry.split() -%}
          {%- set row = namespace(matches=[]) -%}
          {%- for route in runtime -%}
            {%- if (bind_front_ipv4_data[route.get('dst','default') | replace('default','0.0.0.0/0')].cidr) == parts[0] and route.get('dev') == bind_front_plan.device and route.get('gateway') == parts[1] -%}
              {%- set row.matches = row.matches + [route] -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if row.matches | length != 1 or (parts | length == 3 and row.matches[0].get('metric') != parts[2] | int) -%}
            {%- set ns.errors = ns.errors + ['Intended active route missing, duplicated or metric changed'] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ ns.errors | to_json }}

- name: Require exact route preservation
  ansible.builtin.assert:
    that: [(bind_front_comparison_json | from_json if bind_front_comparison_json is string else bind_front_comparison_json) | length == 0]
    fail_msg: '{{ (bind_front_comparison_json | from_json if bind_front_comparison_json is string else bind_front_comparison_json) }}'
