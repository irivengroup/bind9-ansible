---
- name: Verify the active profile has not changed during the route operation
  ansible.builtin.command:
    argv: [nmcli, -g, GENERAL.CON-UUID, device, show, '{{ bind_front_plan.device }}']
  environment: {LC_ALL: C}
  register: bind_front_verified_uuid
  changed_when: false
  failed_when: bind_front_verified_uuid.rc != 0 or (bind_front_verified_uuid.stdout | trim) != bind_front_plan.uuid

- name: Read persistent routes after the operation
  ansible.builtin.command:
    argv: [nmcli, -g, ipv4.routes, connection, show, uuid, '{{ bind_front_plan.uuid }}']
  environment: {LC_ALL: C}
  register: bind_front_verified_profile
  changed_when: false

- name: Verify FRONT gateway still matches the planned profile before commit
  ansible.builtin.command:
    argv: [nmcli, -g, ipv4.gateway, connection, show, uuid, '{{ bind_front_plan.uuid }}']
  environment: {LC_ALL: C}
  register: bind_front_verified_gateway
  changed_when: false

- name: Read active FRONT gateway before commit
  ansible.builtin.command:
    argv: [nmcli, -g, IP4.GATEWAY, device, show, '{{ bind_front_plan.device }}']
  environment: {LC_ALL: C}
  register: bind_front_verified_active_gateway
  changed_when: false
  check_mode: false

- name: Read IPv4 policy after the route operation
  ansible.builtin.command:
    argv: [ip, -j, -4, rule, show]
  register: bind_front_verified_rules
  changed_when: false

- name: Require the unchanged classic policy before FRONT commit
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/deploy/front_routes_policy.yml'
  vars:
    bind_front_rule_observation: '{{ bind_front_verified_rules.stdout }}'

- name: Read the main table after the operation
  ansible.builtin.command:
    argv: [ip, -j, -4, route, show, table, main]
  register: bind_front_verified_kernel
  changed_when: false

- name: Reconcile existing FRONT gateway observations
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/deploy/front_routes_gateway.yml'
  vars:
    bind_front_gateway_profile_value: '{{ bind_front_verified_gateway.stdout }}'
    bind_front_gateway_active_value: '{{ bind_front_verified_active_gateway.stdout }}'
    bind_front_gateway_kernel_value: '{{ bind_front_verified_kernel.stdout }}'
    bind_front_gateway_device: '{{ bind_front_plan.device }}'

- name: Refuse a FRONT gateway changed since planning
  ansible.builtin.assert:
    that: [bind_front_gateway == bind_front_plan.gateway]
    fail_msg: 'FRONT gateway changed since planning; route operation stopped before further writes.'

- name: Require all original routes and intended additions to remain intact
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/deploy/front_routes_compare.yml'
  vars:
    bind_front_compare_profile: '{{ bind_front_verified_profile.stdout }}'
    bind_front_compare_runtime: '{{ bind_front_verified_kernel.stdout }}'
    bind_front_compare_applied: true

- name: Verify effective return routes using the FRONT source address
  ansible.builtin.command:
    argv: [ip, -j, -4, route, get, '{{ item.address }}', from, '{{ bind_front_ip }}']
  loop: '{{ bind_front_plan.probes }}'
  register: bind_front_verified_return
  changed_when: false
  failed_when: >-
    bind_front_verified_return.rc != 0 or
    (bind_front_verified_return.stdout | from_json | length) != 1 or
    (bind_front_verified_return.stdout | from_json)[0].get('dev') != bind_front_plan.device or
    (item.gateway is not none and (bind_front_verified_return.stdout | from_json)[0].get('gateway') != item.gateway)
