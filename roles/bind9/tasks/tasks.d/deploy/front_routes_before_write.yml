---
# Re-read after acquiring the exclusive role lock. A changed observation must
# fail before the pending/mutation flag is set, so rollback owns no routes yet.
- name: Recheck active FRONT profile before the first write
  ansible.builtin.command:
    argv: [nmcli, -g, GENERAL.CON-UUID, device, show, '{{ bind_front_plan.device }}']
  register: bind_front_before_write_uuid
  changed_when: false
  failed_when: bind_front_before_write_uuid.rc != 0 or bind_front_before_write_uuid.stdout | trim != bind_front_plan.uuid

- name: Recheck persistent FRONT gateway and routes under the operation lock
  ansible.builtin.command:
    argv: [nmcli, -g, '{{ item }}', connection, show, uuid, '{{ bind_front_plan.uuid }}']
  loop: [ipv4.gateway, ipv4.routes]
  register: bind_front_before_write_profile
  changed_when: false

- name: Recheck active FRONT gateway under the operation lock
  ansible.builtin.command:
    argv: [nmcli, -g, IP4.GATEWAY, device, show, '{{ bind_front_plan.device }}']
  environment: {LC_ALL: C}
  register: bind_front_before_write_active_gateway
  changed_when: false
  check_mode: false

- name: Recheck main routes and policy rules under the operation lock
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [ip, -j, -4, route, show, table, main]
    - [ip, -j, -4, rule, show]
  register: bind_front_before_write_kernel
  changed_when: false

- name: Reconcile existing FRONT gateway observations
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/deploy/front_routes_gateway.yml'
  vars:
    bind_front_gateway_profile_value: '{{ bind_front_before_write_profile.results[0].stdout }}'
    bind_front_gateway_active_value: '{{ bind_front_before_write_active_gateway.stdout }}'
    bind_front_gateway_kernel_value: '{{ bind_front_before_write_kernel.results[0].stdout }}'
    bind_front_gateway_device: '{{ bind_front_plan.device }}'

- name: Refuse a FRONT gateway changed since planning
  ansible.builtin.assert:
    that: [bind_front_gateway == bind_front_plan.gateway]
    fail_msg: 'FRONT gateway changed since planning; route operation stopped before further writes.'

- name: Require unchanged standard policy before adding routes
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/deploy/front_routes_policy.yml'
  vars:
    bind_front_rule_observation: '{{ bind_front_before_write_kernel.results[1].stdout }}'

- name: Require the exact planned baseline before any route mutation
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/deploy/front_routes_compare.yml'
  vars:
    bind_front_compare_profile: '{{ bind_front_before_write_profile.results[1].stdout }}'
    bind_front_compare_runtime: '{{ bind_front_before_write_kernel.results[0].stdout }}'
    bind_front_compare_applied: false
