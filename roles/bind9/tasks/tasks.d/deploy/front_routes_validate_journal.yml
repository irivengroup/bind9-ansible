---
# Accept the existing unversioned journal schema to recover earlier deliveries.
- name: Require a bounded dictionary with the known route journal schema
  ansible.builtin.assert:
    that:
      - bind_front_plan is mapping
      - (bind_front_plan.keys() | list | sort) == (['device','uuid','gateway','profile_additions','runtime_additions','probes','runtime_before','profile_before','protected_ips'] | sort)
      - (bind_front_plan | to_json | length) < 262144
      - bind_front_plan.device is string and bind_front_plan.device is match('^[a-zA-Z0-9_.:-]{1,15}$')
      - bind_front_plan.uuid is string and bind_front_plan.uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - bind_front_plan.gateway is string and bind_front_plan.gateway is match('^[0-9.]+$')
    fail_msg: 'Invalid FRONT recovery journal. No recovery commands were executed.'

- name: Require typed journal lists
  ansible.builtin.assert:
    that: [item is sequence and item is not string and item is not mapping]
  loop:
    - '{{ bind_front_plan.profile_additions }}'
    - '{{ bind_front_plan.runtime_additions }}'
    - '{{ bind_front_plan.probes }}'
    - '{{ bind_front_plan.runtime_before }}'
    - '{{ bind_front_plan.profile_before }}'
    - '{{ bind_front_plan.protected_ips }}'

- name: Require valid protected journal addresses
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[0-9.]+$')
  loop: '{{ bind_front_plan.protected_ips }}'

- name: Refuse duplicated route ownership entries
  ansible.builtin.assert:
    that:
      - bind_front_plan.profile_additions | unique | list | length == bind_front_plan.profile_additions | length
      - bind_front_plan.runtime_additions | unique | list | length == bind_front_plan.runtime_additions | length
    fail_msg: 'Duplicate owned additions make automated recovery ambiguous.'

- name: Validate owned route syntax before splitting arguments
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[0-9.]+/[0-9]+ [0-9.]+( [0-9]+)?$')
      - item.split() | length in [2, 3]
      - item.split()[1] == bind_front_plan.gateway
      - item.split() | length == 2 or (item.split()[2] | int >= 1 and item.split()[2] | int <= 4294967295)
    fail_msg: 'Malformed owned route; refusing automated removal.'
  loop: '{{ bind_front_plan.profile_additions + bind_front_plan.runtime_additions }}'

- name: Normalize journal addresses before ownership checks
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/deploy/front_routes_ipv4.yml'
  vars:
    bind_front_ipv4_context: 'saved FRONT recovery journal addresses and snapshots'
    bind_front_ipv4_values: >-
      {%- set ns = namespace(values=bind_front_plan.protected_ips + [bind_front_plan.gateway,
          '0.0.0.0/8','127.0.0.0/8','169.254.0.0/16','224.0.0.0/4','240.0.0.0/4']) -%}
      {%- for entry in bind_front_plan.profile_additions + bind_front_plan.runtime_additions -%}
        {%- set ns.values = ns.values + [entry.split()[0]] -%}
      {%- endfor -%}
      {%- for route in bind_front_plan.profile_before + bind_front_plan.runtime_before -%}
        {%- set ns.values = ns.values + [route.get('network',route.get('dst','default')) | replace('default','0.0.0.0/0')] -%}
      {%- endfor -%}
      {{ ns.values | to_json }}

- name: Require canonical nondefault owned networks
  ansible.builtin.assert:
    that:
      - bind_front_ipv4_data[item.split()[0]].cidr == item.split()[0]
      - bind_front_ipv4_data[item.split()[0]].prefix > 0
  loop: '{{ bind_front_plan.profile_additions + bind_front_plan.runtime_additions }}'

- name: Reject unsafe or preexisting owned entries
  ansible.builtin.set_fact:
    bind_front_journal_errors: >-
      {%- set ns = namespace(errors=[]) -%}
      {%- for field in ['profile_additions', 'runtime_additions'] -%}
        {%- set original = bind_front_plan.profile_before if field == 'profile_additions' else bind_front_plan.runtime_before -%}
        {%- for entry in bind_front_plan[field] -%}
          {%- set network = entry.split()[0] -%}
          {%- for address in bind_front_plan.protected_ips + ['0.0.0.0/8','127.0.0.0/8','169.254.0.0/16','224.0.0.0/4','240.0.0.0/4'] -%}
            {%- if bind_front_ipv4_data[address].lo <= bind_front_ipv4_data[network].hi and bind_front_ipv4_data[address].hi >= bind_front_ipv4_data[network].lo -%}
              {%- set ns.errors = ns.errors + ['Recovery route overlaps a protected/reserved address'] -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for row in original -%}
            {%- set destination = bind_front_ipv4_data[row.get('network', row.get('dst', 'default')) | replace('default','0.0.0.0/0')].cidr -%}
            {%- if destination == network -%}{%- set ns.errors = ns.errors + ['Recovery would remove a preexisting route'] -%}{%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.errors | to_json }}

- name: Reject unsafe recovery ownership
  ansible.builtin.assert:
    that: [(bind_front_journal_errors | from_json if bind_front_journal_errors is string else bind_front_journal_errors) | length == 0]
    fail_msg: '{{ (bind_front_journal_errors | from_json if bind_front_journal_errors is string else bind_front_journal_errors) }}'
