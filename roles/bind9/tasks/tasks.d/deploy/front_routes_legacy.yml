# Compatibility only: validated old journals, process-locked native removal and nonrecursive cleanup.
- name: Require normal mode for explicit route recovery
  ansible.builtin.assert:
    that:
    - not ansible_check_mode
    fail_msg: Route recovery requires normal mode after inspecting the interrupted journal.
- name: Inspect private route recovery paths
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
  loop:
  - /var/lib/Bind9-Ansible
  - /var/lib/Bind9-Ansible/front-routes.lock
  - /var/lib/Bind9-Ansible/front-routes.lock/plan.json
  register: bind_front_recovery_paths
- name: Require root-owned safe journal paths
  ansible.builtin.assert:
    that:
    - item.stat.exists
    - item.stat.uid == 0
    - not (item.stat.islnk | default(false))
    - ((item.item | basename) == 'plan.json' and (item.stat.isreg | default(false))) or ((item.item | basename) != 'plan.json'
      and (item.stat.isdir | default(false)))
    - item.stat.mode == ('0600' if (item.item | basename) == 'plan.json' else '0700')
    - (item.item | basename) != 'plan.json' or (item.stat.nlink | default(0) | int) == 1
    - item.stat.size | int < 262144
    fail_msg: Recovery journal missing or unsafe; inspect it manually without removing the operation lock.
  loop: '{{ bind_front_recovery_paths.results }}'
  loop_control:
    label: '{{ item.item }}'
- name: Read the interrupted operation journal
  ansible.builtin.slurp:
    src: /var/lib/Bind9-Ansible/front-routes.lock/plan.json
  register: bind_front_recovery_data
- name: Validate the interrupted plan on the controller
  ansible.builtin.set_fact:
    bind_front_plan: '{{ bind_front_recovery_data.content | b64decode | from_json }}'
- name: Validate the interrupted native route journal
  tags:
  - legacy-helper-front_routes_validate_journal.yml
  block: &id001
  - name: Require a bounded dictionary with the known route journal schema
    ansible.builtin.assert:
      that:
      - bind_front_plan is mapping
      - (bind_front_plan.keys() | list | sort) == (['device','uuid','gateway','profile_additions','runtime_additions','probes','runtime_before','profile_before','protected_ips']
        | sort)
      - (bind_front_plan | to_json | length) < 262144
      - bind_front_plan.device is string and bind_front_plan.device is match('^[a-zA-Z0-9_.:-]{1,15}$')
      - bind_front_plan.uuid is string and bind_front_plan.uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - bind_front_plan.gateway is string and bind_front_plan.gateway is match('^[0-9.]+$')
      fail_msg: Invalid FRONT recovery journal. No recovery commands were executed.
  - name: Require typed journal lists
    ansible.builtin.assert:
      that:
      - item is sequence and item is not string and item is not mapping
    loop:
    - '{{ bind_front_plan.profile_additions }}'
    - '{{ bind_front_plan.runtime_additions }}'
    - '{{ bind_front_plan.probes }}'
    - '{{ bind_front_plan.runtime_before }}'
    - '{{ bind_front_plan.profile_before }}'
    - '{{ bind_front_plan.protected_ips }}'
  - name: Require valid protected journal addresses
    ansible.builtin.assert:
      that:
      - item is string
      - item is match('^[0-9.]+$')
    loop: '{{ bind_front_plan.protected_ips }}'
  - name: Refuse duplicated route ownership entries
    ansible.builtin.assert:
      that:
      - bind_front_plan.profile_additions | unique | list | length == bind_front_plan.profile_additions | length
      - bind_front_plan.runtime_additions | unique | list | length == bind_front_plan.runtime_additions | length
      fail_msg: Duplicate owned additions make automated recovery ambiguous.
  - name: Validate owned route syntax before splitting arguments
    ansible.builtin.assert:
      that:
      - item is string
      - item is match('^[0-9.]+/[0-9]+ [0-9.]+( [0-9]+)?$')
      - item.split() | length in [2, 3]
      - item.split()[1] == bind_front_plan.gateway
      - item.split() | length == 2 or (item.split()[2] | int >= 1 and item.split()[2] | int <= 4294967295)
      fail_msg: Malformed owned route; refusing automated removal.
    loop: '{{ bind_front_plan.profile_additions + bind_front_plan.runtime_additions }}'
  - name: Normalize journal addresses before ownership checks
    vars:
      bind_front_ipv4_context: saved FRONT recovery journal addresses and snapshots
      bind_front_ipv4_values: "{%- set ns = namespace(values=bind_front_plan.protected_ips + [bind_front_plan.gateway,\n \
        \   '0.0.0.0/8','127.0.0.0/8','169.254.0.0/16','224.0.0.0/4','240.0.0.0/4']) -%}\n{%- for entry in bind_front_plan.profile_additions\
        \ + bind_front_plan.runtime_additions -%}\n  {%- set ns.values = ns.values + [entry.split()[0]] -%}\n{%- endfor -%}\
        \ {%- for route in bind_front_plan.profile_before + bind_front_plan.runtime_before -%}\n  {%- set ns.values = ns.values\
        \ + [route.get('network',route.get('dst','default')) | replace('default','0.0.0.0/0')] -%}\n{%- endfor -%} {{ ns.values\
        \ | to_json }}"
    tags:
    - legacy-helper-front_routes_ipv4.yml
    block: &id002
    - name: Require a typed IPv4 observation list before normalization
      ansible.builtin.assert:
        that:
        - (bind_front_ipv4_values | from_json if bind_front_ipv4_values is string else bind_front_ipv4_values) is sequence
        - (bind_front_ipv4_values | from_json if bind_front_ipv4_values is string else bind_front_ipv4_values) is not string
        - (bind_front_ipv4_values | from_json if bind_front_ipv4_values is string else bind_front_ipv4_values) is not mapping
        fail_msg: IPv4 observations must be a native list or JSON array of address/CIDR strings, never a scalar or mapping.
    - name: Validate and normalize IPv4 observations using native task expressions
      ansible.builtin.set_fact:
        bind_front_ipv4_json: "{%- set ns = namespace(data={}, errors=[]) -%} {%- for value in (bind_front_ipv4_values | from_json\
          \ if bind_front_ipv4_values is string else bind_front_ipv4_values) | unique | list -%}\n  {%- if value is not string\
          \ or not (value is match('^(0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]{0,2})(/[0-9]{1,2})?$'))\
          \ -%}\n    {%- set ns.errors = ns.errors + ['Invalid IPv4 value (type=' ~ (value | type_debug) ~ '): ' ~ (value\
          \ | to_json)] -%}\n  {%- else -%}\n    {%- set address = value.split('/')[0] -%}\n    {%- set octets = address.split('.')\
          \ | map('int') | list -%}\n    {%- set prefix = value.split('/')[1] | int if '/' in value else 32 -%}\n    {%- if\
          \ octets | max > 255 or prefix < 0 or prefix > 32 -%}\n      {%- set ns.errors = ns.errors + ['IPv4 octet or prefix\
          \ out of bounds: ' ~ value] -%}\n    {%- else -%}\n      {%- set number = octets[0]*16777216 + octets[1]*65536 +\
          \ octets[2]*256 + octets[3] -%}\n      {%- set size = 2 ** (32-prefix) -%}\n      {%- set low = (number // size)\
          \ * size -%}\n      {%- set high = low + size - 1 -%}\n      {%- set network = [low//16777216, (low//65536)%256,\
          \ (low//256)%256, low%256] | join('.') -%}\n      {%- set broadcast = [high//16777216, (high//65536)%256, (high//256)%256,\
          \ high%256] | join('.') -%}\n      {%- set probe = low if prefix == 32 else low+1 -%}\n      {%- set ns.data = ns.data\
          \ | combine({value: {'prefix':prefix,\n          'lo':low, 'hi':high, 'network':network, 'broadcast':broadcast,\
          \ 'cidr':network ~ '/' ~ prefix,\n          'probe': [probe//16777216, (probe//65536)%256, (probe//256)%256, probe%256]\
          \ | join('.')}}) -%}\n      {%- set ns.data = ns.data | combine({network ~ '/' ~ prefix: ns.data[value]}) -%}\n\
          \    {%- endif -%}\n  {%- endif -%}\n{%- endfor -%} {{ {'data':ns.data, 'errors':ns.errors} | to_json }}"
    - name: Reject invalid IPv4 observations before any routing write
      ansible.builtin.assert:
        that:
        - ((bind_front_ipv4_json | from_json if bind_front_ipv4_json is string else bind_front_ipv4_json)).errors | length
          == 0
        fail_msg: 'Invalid IPv4 observations in {{ bind_front_ipv4_context | default(''FRONT address/profile/journal observation'')
          }}: {{ ((bind_front_ipv4_json | from_json if bind_front_ipv4_json is string else bind_front_ipv4_json)).errors }}.
          Expected canonical IPv4 addresses or CIDRs as strings. No routing writes were performed by this normalization step.'
    - name: Retain typed IPv4 intervals for the route operation
      ansible.builtin.set_fact:
        bind_front_ipv4_data: '{{ (bind_front_ipv4_data | default({})) | combine(((bind_front_ipv4_json | from_json if bind_front_ipv4_json
          is string else bind_front_ipv4_json)).data) }}'
  - name: Require canonical nondefault owned networks
    ansible.builtin.assert:
      that:
      - bind_front_ipv4_data[item.split()[0]].cidr == item.split()[0]
      - bind_front_ipv4_data[item.split()[0]].prefix > 0
    loop: '{{ bind_front_plan.profile_additions + bind_front_plan.runtime_additions }}'
  - name: Reject unsafe or preexisting owned entries
    ansible.builtin.set_fact:
      bind_front_journal_errors: "{%- set ns = namespace(errors=[]) -%} {%- for field in ['profile_additions', 'runtime_additions']\
        \ -%}\n  {%- set original = bind_front_plan.profile_before if field == 'profile_additions' else bind_front_plan.runtime_before\
        \ -%}\n  {%- for entry in bind_front_plan[field] -%}\n    {%- set network = entry.split()[0] -%}\n    {%- for address\
        \ in bind_front_plan.protected_ips + ['0.0.0.0/8','127.0.0.0/8','169.254.0.0/16','224.0.0.0/4','240.0.0.0/4'] -%}\n\
        \      {%- if bind_front_ipv4_data[address].lo <= bind_front_ipv4_data[network].hi and bind_front_ipv4_data[address].hi\
        \ >= bind_front_ipv4_data[network].lo -%}\n        {%- set ns.errors = ns.errors + ['Recovery route overlaps a protected/reserved\
        \ address'] -%}\n      {%- endif -%}\n    {%- endfor -%}\n    {%- for row in original -%}\n      {%- set destination\
        \ = bind_front_ipv4_data[row.get('network', row.get('dst', 'default')) | replace('default','0.0.0.0/0')].cidr -%}\n\
        \      {%- if destination == network -%}{%- set ns.errors = ns.errors + ['Recovery would remove a preexisting route']\
        \ -%}{%- endif -%}\n    {%- endfor -%}\n  {%- endfor -%}\n{%- endfor -%} {{ ns.errors | to_json }}"
  - name: Reject unsafe recovery ownership
    ansible.builtin.assert:
      that:
      - (bind_front_journal_errors | from_json if bind_front_journal_errors is string else bind_front_journal_errors) | length
        == 0
      fail_msg: '{{ (bind_front_journal_errors | from_json if bind_front_journal_errors is string else bind_front_journal_errors)
        }}'
- name: Mark the interrupted route operation pending
  ansible.builtin.set_fact:
    bind_front_route_transaction_pending: true
- name: Restore only routes added by the interrupted operation
  tags:
  - legacy-helper-front_routes_rollback.yml
  block:
  - name: Record that selective FRONT rollback was attempted
    ansible.builtin.set_fact:
      bind_front_route_rollback_attempted: true
  - name: Validate route journal before selecting owned removals
    tags:
    - legacy-helper-front_routes_validate_journal.yml
    block: *id001
  - name: Inspect active FRONT identity before rollback
    ansible.builtin.command:
      argv:
      - nmcli
      - -g
      - GENERAL.CON-UUID
      - device
      - show
      - '{{ bind_front_plan.device }}'
    environment:
      LC_ALL: C
    register: bind_front_rollback_uuid
    changed_when: false
    failed_when: bind_front_rollback_uuid.rc != 0 or (bind_front_rollback_uuid.stdout | trim) != bind_front_plan.uuid
  - name: Read the existing FRONT gateway before any rollback mutation
    ansible.builtin.command:
      argv:
      - nmcli
      - -g
      - ipv4.gateway
      - connection
      - show
      - uuid
      - '{{ bind_front_plan.uuid }}'
    environment:
      LC_ALL: C
    register: bind_front_rollback_gateway
    changed_when: false
    failed_when: bind_front_rollback_gateway.rc != 0 or bind_front_rollback_gateway.stdout | trim != bind_front_plan.gateway
  - name: Read current policy rules before any rollback mutation
    ansible.builtin.command:
      argv:
      - ip
      - -j
      - -4
      - rule
      - show
    register: bind_front_rollback_rules
    changed_when: false
  - name: Refuse policy drift before removing any FRONT route
    vars:
      bind_front_rule_observation: '{{ bind_front_rollback_rules.stdout }}'
    tags:
    - legacy-helper-front_routes_policy.yml
    block:
    - name: Require a nonempty list of three standard IPv4 routing rules
      ansible.builtin.assert:
        that:
        - (bind_front_rule_observation | from_json if bind_front_rule_observation is string else bind_front_rule_observation)
          is sequence
        - (bind_front_rule_observation | from_json if bind_front_rule_observation is string else bind_front_rule_observation)
          is not string
        - (bind_front_rule_observation | from_json if bind_front_rule_observation is string else bind_front_rule_observation)
          is not mapping
        - (bind_front_rule_observation | from_json if bind_front_rule_observation is string else bind_front_rule_observation)
          | length == 3
        fail_msg: IPv4 policy observation must contain the three classic rules; no routing writes allowed.
    - name: Refuse custom selectors or alternate IPv4 rule tables
      ansible.builtin.assert:
        that:
        - item is mapping
        - (item.keys() | list | difference(['priority', 'src', 'table', 'protocol'])) | length == 0
        - item.priority in [0, 32766, 32767]
        - item.src == 'all'
        - item.table == {0:'local', 32766:'main', 32767:'default'}[item.priority]
        fail_msg: Only selector-free local/main/default IPv4 rules are supported.
      loop: '{{ bind_front_rule_observation | from_json if bind_front_rule_observation is string else bind_front_rule_observation
        }}'
    - name: Refuse duplicate or missing standard IPv4 rule priorities
      ansible.builtin.assert:
        that:
        - ((bind_front_rule_observation | from_json if bind_front_rule_observation is string else bind_front_rule_observation)
          | map(attribute='priority') | list | sort) == [0, 32766, 32767]
  - name: Read the actual SSH peer before route recovery
    ansible.builtin.command:
      argv:
      - printenv
      - SSH_CONNECTION
    become: false
    register: bind_front_recovery_ssh
    changed_when: false
    failed_when: bind_front_recovery_ssh.rc != 0 or (bind_front_recovery_ssh.stdout.split() | length) != 4
    when: ansible_connection | default('ssh') != 'local'
  - name: Record the current SSH source for recovery protection
    ansible.builtin.set_fact:
      bind_front_ssh_client: '{{ bind_front_recovery_ssh.stdout.split()[0] if ansible_connection | default("ssh") != "local"
        else "" }}'
  - name: Normalize the current SSH peer before owned route removal
    tags:
    - legacy-helper-front_routes_ssh_normalize.yml
    block:
    - name: Normalize the real SSH peer without a custom filter
      ansible.builtin.set_fact:
        bind_front_ssh_ipv4: "{%- set value = bind_front_ssh_client | lower -%} {%- if value is match('^::ffff:([0-9]{1,3}\\\
          \\.){3}[0-9]{1,3}$') -%}\n  {{ value.split('::ffff:')[-1] }}\n{%- elif value is match('^::ffff:[0-9a-f]{1,4}:[0-9a-f]{1,4}$')\
          \ -%}\n  {%- set tail = value.split('::ffff:')[-1] -%}\n  {%- set parts = tail.split(':') -%}\n  {%- set high =\
          \ parts[0] | int(base=16) -%}{%- set low = parts[1] | int(base=16) -%}\n  {{ [high//256, high%256, low//256, low%256]\
          \ | join('.') }}\n{%- elif ':' in value -%}{{ '' }} {%- else -%}{{ value }}{%- endif -%}"
  - name: Normalize current inventory and SSH addresses for recovery protection
    vars:
      bind_front_ipv4_context: current inventory and SSH source during FRONT rollback
      bind_front_ipv4_values: "{{ ([ansible_host, bind_front_ip, bind_back_ip,\n    hostvars[bind_primary_host].bind_back_ip,\
        \ hostvars[bind_secondary_host].bind_back_ip] +\n   ([bind_front_ssh_ipv4] if bind_front_ssh_ipv4 else [])) | to_json\
        \ }}"
    tags:
    - legacy-helper-front_routes_ipv4.yml
    block: *id002
  - name: Refuse owned routes that cover current administrative or DNS addresses
    ansible.builtin.assert:
      that:
      - not (bind_front_ipv4_data[item.1].lo <= bind_front_ipv4_data[item.0.split()[0]].hi and bind_front_ipv4_data[item.1].hi
        >= bind_front_ipv4_data[item.0.split()[0]].lo)
      fail_msg: Recovery would affect a current ADM, FRONT, BACK or SSH address; no route removals were started.
    loop: "{{ (bind_front_plan.profile_additions + bind_front_plan.runtime_additions) | product(\n   [ansible_host, bind_front_ip,\
      \ bind_back_ip, hostvars[bind_primary_host].bind_back_ip,\n    hostvars[bind_secondary_host].bind_back_ip] + ([bind_front_ssh_ipv4]\
      \ if bind_front_ssh_ipv4 else [])) | list }}"
  - name: Read persistent routes available for selective rollback
    ansible.builtin.command:
      argv:
      - nmcli
      - -g
      - ipv4.routes
      - connection
      - show
      - uuid
      - '{{ bind_front_plan.uuid }}'
    environment:
      LC_ALL: C
    register: bind_front_rollback_profile
    changed_when: false
  - name: Parse persistent routes before selecting owned removals
    vars:
      bind_front_routes_text: '{{ bind_front_rollback_profile.stdout }}'
    tags:
    - legacy-helper-front_routes_parse_profile.yml
    block: &id003
    - name: Parse native NetworkManager route observations
      ansible.builtin.set_fact:
        bind_front_parsed_profile_json: "{%- set ns = namespace(routes=[], errors=[]) -%} {%- set text = bind_front_routes_text\
          \ | trim -%} {%- if text not in ['', '--'] -%}\n  {%- set braced = '{' in text or '}' in text -%}\n  {%- set entries\
          \ = (text | regex_findall('[{]([^{}]+)[}]')) if braced else text.split(',') -%}\n  {%- if braced and (text | regex_replace('[{][^{}]+[}]',\
          \ '') | regex_replace('[,;]', '') | trim) -%}\n    {%- set ns.errors = ns.errors + ['Unsupported nmcli route format']\
          \ -%}\n  {%- endif -%}\n  {%- for entry in entries -%}\n    {%- set row = namespace(fields={}) -%}\n    {%- if braced\
          \ -%}\n      {%- for field in entry.split(',') -%}\n        {%- set pair = field.strip().split('=', 1) -%}\n   \
          \     {%- if pair | length != 2 or pair[0] | trim in row.fields -%}\n          {%- set ns.errors = ns.errors + ['Malformed\
          \ nmcli route fields'] -%}\n        {%- else -%}\n          {%- set row.fields = row.fields | combine({pair[0] |\
          \ trim: pair[1] | trim}) -%}\n        {%- endif -%}\n      {%- endfor -%}\n    {%- else -%}\n      {%- set parts\
          \ = entry.split() -%}\n      {%- if parts -%}\n        {%- set row.fields = {'ip': parts[0], 'nh': '0.0.0.0', 'mt':\
          \ '-1'} -%}\n        {%- set rest = namespace(parts=parts[1:]) -%}\n        {%- if rest.parts and '.' in rest.parts[0]\
          \ and '=' not in rest.parts[0] -%}\n          {%- set row.fields = row.fields | combine({'nh': rest.parts[0]}) -%}\n\
          \          {%- set rest.parts = rest.parts[1:] -%}\n        {%- endif -%}\n        {%- if rest.parts and rest.parts[0]\
          \ is match('^-?[0-9]+$') -%}\n          {%- set row.fields = row.fields | combine({'mt': rest.parts[0]}) -%}\n \
          \         {%- set rest.parts = rest.parts[1:] -%}\n        {%- endif -%}\n        {%- for field in rest.parts -%}\n\
          \          {%- set pair = field.split('=', 1) -%}\n          {%- if pair | length != 2 or not pair[0] or not pair[1]\
          \ or pair[0] in row.fields -%}\n            {%- set ns.errors = ns.errors + ['Malformed terse route attributes']\
          \ -%}\n          {%- else -%}\n            {%- set row.fields = row.fields | combine({pair[0]: pair[1]}) -%}\n \
          \         {%- endif -%}\n        {%- endfor -%}\n      {%- endif -%}\n    {%- endif -%}\n    {%- if not row.fields.get('ip')\
          \ or not row.fields.get('nh') or not (row.fields.get('mt', '-1') is match('^-?[0-9]+$')) -%}\n      {%- set ns.errors\
          \ = ns.errors + ['Invalid nmcli route destination/gateway/metric'] -%}\n    {%- else -%}\n      {%- set attrs =\
          \ row.fields | dict2items | rejectattr('key', 'in', ['ip', 'nh', 'mt']) | list | items2dict -%}\n      {%- set ns.routes\
          \ = ns.routes + [{'network': row.fields.ip, 'gateway': row.fields.nh,\n          'metric': row.fields.get('mt',\
          \ '-1') | int, 'attributes': attrs}] -%}\n    {%- endif -%}\n  {%- endfor -%}\n  {%- if not entries -%}{%- set ns.errors\
          \ = ns.errors + ['Empty nmcli route entries'] -%}{%- endif -%}\n{%- endif -%} {{ {'routes': ns.routes, 'errors':\
          \ ns.errors} | to_json }}"
    - name: Reject ambiguous persistent route observations
      ansible.builtin.assert:
        that:
        - ((bind_front_parsed_profile_json | from_json if bind_front_parsed_profile_json is string else bind_front_parsed_profile_json)).errors
          | length == 0
        fail_msg: '{{ ((bind_front_parsed_profile_json | from_json if bind_front_parsed_profile_json is string else bind_front_parsed_profile_json)).errors
          }}'
    - name: Retain typed persistent route observations
      ansible.builtin.set_fact:
        bind_front_parsed_profile: '{{ ((bind_front_parsed_profile_json | from_json if bind_front_parsed_profile_json is string
          else bind_front_parsed_profile_json)).routes }}'
    - name: Normalize persistent route observations
      vars:
        bind_front_ipv4_context: nmcli ipv4.routes on the selected FRONT profile
        bind_front_ipv4_values: "{%- set ns = namespace(values=[]) -%} {%- for route in bind_front_parsed_profile -%}\n  {%-\
          \ set ns.values = ns.values + [route.network, route.gateway] -%}\n{%- endfor -%} {{ ns.values | to_json }}"
      tags:
      - legacy-helper-front_routes_ipv4.yml
      block: *id002
    - name: Retain canonical persistent destinations
      ansible.builtin.set_fact:
        bind_front_parsed_profile: "{%- set ns = namespace(routes=[]) -%} {%- for route in bind_front_parsed_profile -%}\n\
          \  {%- set ns.routes = ns.routes + [route | combine({'network':bind_front_ipv4_data[route.network].cidr})] -%}\n\
          {%- endfor -%} {{ ns.routes }}"
  - name: Select exact owned persistent additions with native expressions
    ansible.builtin.set_fact:
      bind_front_profile_selection: "{%- set ns = namespace(routes=[], errors=[]) -%} {%- for entry in bind_front_plan.profile_additions\
        \ -%}\n  {%- set parts = entry.split() -%}\n  {%- set matching = bind_front_parsed_profile | selectattr('network',\
        \ 'equalto', parts[0]) | list -%}\n  {%- set expected = {'network':parts[0], 'gateway':parts[1], 'metric':(parts[2]\
        \ | int) if parts | length == 3 else -1, 'attributes':{}} -%}\n  {%- if matching and matching != [expected] -%}\n\
        \    {%- set ns.errors = ns.errors + ['Owned persistent route identity changed; manual recovery required'] -%}\n \
        \ {%- elif matching -%}{%- set ns.routes = ns.routes + [entry] -%}{%- endif -%}\n{%- endfor -%} {{ {'routes':ns.routes,\
        \ 'errors':ns.errors} | to_json }}"
  - name: Refuse removal of a modified persistent route
    ansible.builtin.assert:
      that:
      - ((bind_front_profile_selection | from_json if bind_front_profile_selection is string else bind_front_profile_selection)).errors
        | length == 0
      fail_msg: '{{ ((bind_front_profile_selection | from_json if bind_front_profile_selection is string else bind_front_profile_selection)).errors
        }}'
  - name: Read runtime routes available for selective rollback
    ansible.builtin.command:
      argv:
      - ip
      - -j
      - -4
      - route
      - show
      - table
      - main
    register: bind_front_rollback_kernel
    changed_when: false
  - name: Normalize active destinations being inspected
    vars:
      bind_front_ipv4_context: ip -j -4 route show table main during rollback
      bind_front_ipv4_values: "{%- set ns = namespace(values=[]) -%} {%- for route in bind_front_rollback_kernel.stdout |\
        \ from_json -%}\n  {%- set ns.values = ns.values + [route.get('dst','default') | replace('default','0.0.0.0/0')] -%}\n\
        {%- endfor -%} {{ ns.values | to_json }}"
    tags:
    - legacy-helper-front_routes_ipv4.yml
    block: *id002
  - name: Select exact owned active additions with native expressions
    ansible.builtin.set_fact:
      bind_front_runtime_selection: "{%- set ns = namespace(routes=[], errors=[]) -%} {%- for entry in bind_front_plan.runtime_additions\
        \ -%}\n  {%- set parts = entry.split() -%}\n  {%- set row = namespace(matching=[]) -%}\n  {%- for route in bind_front_rollback_kernel.stdout\
        \ | from_json -%}\n    {%- if (bind_front_ipv4_data[route.get('dst','default') | replace('default','0.0.0.0/0')].cidr)\
        \ == parts[0] -%}\n      {%- set row.matching = row.matching + [route] -%}\n    {%- endif -%}\n  {%- endfor -%}\n\
        \  {%- if row.matching -%}\n    {%- if row.matching | length != 1 or row.matching[0].get('dev') != bind_front_plan.device\
        \ or row.matching[0].get('gateway') != parts[1] or\n        row.matching[0].get('type','unicast') != 'unicast' or\n\
        \        (row.matching[0].keys() | list | difference(['dst','gateway','dev','metric','protocol','scope','flags','type','table']))\
        \ or\n        row.matching[0].get('flags',[]) != [] or row.matching[0].get('table','main') not in ['main',254,'254']\
        \ or\n        row.matching[0].get('protocol','boot') not in ['boot','static',3,4] or\n        row.matching[0].get('scope','global')\
        \ not in ['global','universe',0] or\n        row.matching[0].get('metric',0) != ((parts[2] | int) if parts | length\
        \ == 3 else 0) -%}\n      {%- set ns.errors = ns.errors + ['Owned active route identity changed; manual recovery required']\
        \ -%}\n    {%- else -%}{%- set ns.routes = ns.routes + [entry] -%}{%- endif -%}\n  {%- endif -%}\n{%- endfor -%} {{\
        \ {'routes':ns.routes, 'errors':ns.errors} | to_json }}"
  - name: Refuse removal of a modified active route
    ansible.builtin.assert:
      that:
      - ((bind_front_runtime_selection | from_json if bind_front_runtime_selection is string else bind_front_runtime_selection)).errors
        | length == 0
      fail_msg: '{{ ((bind_front_runtime_selection | from_json if bind_front_runtime_selection is string else bind_front_runtime_selection)).errors
        }}'
  - name: Bind legacy recovery to its exact validated observations and journal identity
    ansible.builtin.set_fact:
      bind_front_legacy_arguments: "{%- set ns = namespace(args=['--front-ip', bind_front_ip, '--back-ip', bind_back_ip,\n\
        \          '--adm-ip', ansible_host, '--token', bind_front_plan.uuid, '--legacy-gateway', bind_front_plan.gateway,\n\
        \          '--legacy-profile-sha', bind_front_rollback_profile.stdout | hash('sha256'),\n          '--legacy-kernel-sha',\
        \ bind_front_rollback_kernel.stdout | hash('sha256'),\n          '--legacy-journal-sha', bind_front_recovery_data.content\
        \ | b64decode | hash('sha256'),\n          '--legacy-dir-id', (bind_front_recovery_paths.results[1].stat.dev | string)\
        \ ~ ':' ~ (bind_front_recovery_paths.results[1].stat.inode | string),\n          '--legacy-file-id', (bind_front_recovery_paths.results[2].stat.dev\
        \ | string) ~ ':' ~ (bind_front_recovery_paths.results[2].stat.inode | string)]) -%}\n          {%- if bind_front_ssh_client\
        \ | default('') -%}{%- set ns.args = ns.args + ['--ssh-peer', bind_front_ssh_client] -%}{%- endif -%}\n          {%-\
        \ for route in (bind_front_profile_selection | from_json if bind_front_profile_selection is string else bind_front_profile_selection).routes\
        \ -%}\n            {%- set ns.args = ns.args + ['--legacy-profile-route', route] -%}\n          {%- endfor -%}\n \
        \         {%- for route in (bind_front_runtime_selection | from_json if bind_front_runtime_selection is string else\
        \ bind_front_runtime_selection).routes -%}\n            {%- set ns.args = ns.args + ['--legacy-runtime-route', route]\
        \ -%}\n          {%- endfor -%}\n          {{ ns.args }}"
  - name: Remove only validated legacy additions under the shared process lock
    ansible.builtin.script:
      cmd: '{{ (role_path ~ "/files/bind-front-routes.sh") | quote }} --action legacy-rollback {{ bind_front_legacy_arguments
        | map("quote") | join(" ") }}'
      executable: /bin/bash
    register: bind_front_legacy_operation
    changed_when: bind_front_legacy_operation.rc == 2
    failed_when: bind_front_legacy_operation.rc not in [0, 2]
  - name: Read restored profile and main table
    ansible.builtin.command:
      argv: '{{ item }}'
    loop:
    - - nmcli
      - -g
      - ipv4.routes
      - connection
      - show
      - uuid
      - '{{ bind_front_plan.uuid }}'
    - - ip
      - -j
      - -4
      - route
      - show
      - table
      - main
    environment:
      LC_ALL: C
    register: bind_front_restored
    changed_when: false
  - name: Require the exact original routing state
    vars:
      bind_front_compare_profile: '{{ bind_front_restored.results[0].stdout }}'
      bind_front_compare_runtime: '{{ bind_front_restored.results[1].stdout }}'
      bind_front_compare_applied: false
    tags:
    - legacy-helper-front_routes_compare.yml
    block:
    - name: Parse the persistent routes being verified
      vars:
        bind_front_routes_text: '{{ bind_front_compare_profile }}'
      tags:
      - legacy-helper-front_routes_parse_profile.yml
      block: *id003
    - name: Normalize active destinations being inspected
      vars:
        bind_front_ipv4_context: ip -j -4 route show table main during verification
        bind_front_ipv4_values: "{%- set ns = namespace(values=[]) -%} {%- for route in (bind_front_compare_runtime | from_json\
          \ if bind_front_compare_runtime is string else bind_front_compare_runtime) -%}\n  {%- set ns.values = ns.values\
          \ + [route.get('dst','default') | replace('default','0.0.0.0/0')] -%}\n{%- endfor -%} {{ ns.values | to_json }}"
      tags:
      - legacy-helper-front_routes_ipv4.yml
      block: *id002
    - name: Compute exact routing preservation diagnostics
      ansible.builtin.set_fact:
        bind_front_comparison_json: "{%- set ns = namespace(errors=[], expected=bind_front_plan.profile_before) -%} {%- set\
          \ runtime = (bind_front_compare_runtime | from_json if bind_front_compare_runtime is string else bind_front_compare_runtime)\
          \ -%} {%- if bind_front_compare_applied | bool -%}\n  {%- for entry in bind_front_plan.profile_additions -%}\n \
          \   {%- set parts = entry.split() -%}\n    {%- set ns.expected = ns.expected + [{'network':parts[0], 'gateway':parts[1],\
          \ 'metric':(parts[2] | int) if parts | length == 3 else -1, 'attributes':{}}] -%}\n  {%- endfor -%}\n{%- endif -%}\
          \ {%- if (ns.expected | map('to_json', sort_keys=true) | list | sort) != (bind_front_parsed_profile | map('to_json',\
          \ sort_keys=true) | list | sort) -%}\n  {%- set ns.errors = ns.errors + ['Persistent route state differs from the\
          \ exact additive plan'] -%}\n{%- endif -%} {%- if bind_front_plan.runtime_before | difference(runtime) | length\
          \ > 0 -%}\n  {%- set ns.errors = ns.errors + ['A preexisting route/default changed or disappeared'] -%}\n{%- endif\
          \ -%} {%- for route in runtime | difference(bind_front_plan.runtime_before) -%}\n  {%- set row = namespace(allowed=false)\
          \ -%}\n  {%- for entry in bind_front_plan.runtime_additions if bind_front_compare_applied | bool -%}\n    {%- set\
          \ parts = entry.split() -%}\n    {%- if (bind_front_ipv4_data[route.get('dst','default') | replace('default','0.0.0.0/0')].cidr)\
          \ == parts[0] and route.get('dev') == bind_front_plan.device and route.get('gateway') == parts[1] -%}\n      {%-\
          \ set row.allowed = true -%}\n    {%- endif -%}\n  {%- endfor -%}\n  {%- if not row.allowed -%}{%- set ns.errors\
          \ = ns.errors + ['An unrelated active route appeared'] -%}{%- endif -%}\n{%- endfor -%} {%- if bind_front_compare_applied\
          \ | bool -%}\n  {%- for entry in bind_front_plan.runtime_additions -%}\n    {%- set parts = entry.split() -%}\n\
          \    {%- set row = namespace(matches=[]) -%}\n    {%- for route in runtime -%}\n      {%- if (bind_front_ipv4_data[route.get('dst','default')\
          \ | replace('default','0.0.0.0/0')].cidr) == parts[0] and route.get('dev') == bind_front_plan.device and route.get('gateway')\
          \ == parts[1] -%}\n        {%- set row.matches = row.matches + [route] -%}\n      {%- endif -%}\n    {%- endfor\
          \ -%}\n    {%- if row.matches | length != 1 or row.matches[0].get('type','unicast') != 'unicast' or\n        (row.matches[0].keys()\
          \ | list | difference(['dst','gateway','dev','metric','protocol','scope','flags','type','table'])) or\n        row.matches[0].get('flags',[])\
          \ != [] or row.matches[0].get('table','main') not in ['main',254,'254'] or\n        row.matches[0].get('protocol','boot')\
          \ not in ['boot','static',3,4] or\n        row.matches[0].get('scope','global') not in ['global','universe',0] or\n\
          \        row.matches[0].get('metric',0) != ((parts[2] | int) if parts | length == 3 else 0) -%}\n      {%- set ns.errors\
          \ = ns.errors + ['Intended active route missing, duplicated or metric changed'] -%}\n    {%- endif -%}\n  {%- endfor\
          \ -%}\n{%- endif -%} {{ ns.errors | to_json }}"
    - name: Require exact route preservation
      ansible.builtin.assert:
        that:
        - (bind_front_comparison_json | from_json if bind_front_comparison_json is string else bind_front_comparison_json)
          | length == 0
        fail_msg: '{{ (bind_front_comparison_json | from_json if bind_front_comparison_json is string else bind_front_comparison_json)
          }}'
  - name: Remove the recovery journal after successful rollback
    ansible.builtin.script:
      cmd: '{{ (role_path ~ "/files/bind-front-routes.sh") | quote }} --action legacy-cleanup {{ bind_front_legacy_arguments
        | map("quote") | join(" ") }}'
      executable: /bin/bash
    register: bind_front_legacy_cleanup
    changed_when: bind_front_legacy_cleanup.rc == 2
    failed_when: bind_front_legacy_cleanup.rc not in [0, 2]
  - name: Mark owned FRONT additions completely rolled back
    ansible.builtin.set_fact:
      bind_front_route_transaction_pending: false
