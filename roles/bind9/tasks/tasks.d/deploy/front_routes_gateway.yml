---
# Resolve observations of the selected FRONT only. Never infer a gateway from
# arbitrary destination routes: those next hops need not serve cloud clients.
- name: Require typed FRONT gateway observations
  ansible.builtin.assert:
    that:
      - bind_front_gateway_profile_value is string
      - bind_front_gateway_active_value is string
      - bind_front_gateway_device is string
      - (bind_front_gateway_kernel_value | from_json if bind_front_gateway_kernel_value is string else bind_front_gateway_kernel_value) is sequence
      - (bind_front_gateway_kernel_value | from_json if bind_front_gateway_kernel_value is string else bind_front_gateway_kernel_value) is not mapping
      - (bind_front_gateway_kernel_value | from_json if bind_front_gateway_kernel_value is string else bind_front_gateway_kernel_value) is not string
    fail_msg: 'Invalid FRONT gateway observations; no gateway can be inferred safely.'

- name: Require structured kernel routes for FRONT gateway discovery
  ansible.builtin.assert:
    that: [item is mapping]
    fail_msg: 'Malformed kernel route during FRONT gateway discovery.'
  loop: '{{ bind_front_gateway_kernel_value | from_json if bind_front_gateway_kernel_value is string else bind_front_gateway_kernel_value }}'

- name: Require typed kernel next hops before reconciling FRONT gateways
  ansible.builtin.assert:
    that:
      - item.get('gateway', '') is string
      - item.get('nexthops', []) is sequence
      - item.get('nexthops', []) is not string
      - item.get('nexthops', []) is not mapping
      - (item.get('nexthops', []) | select('mapping') | list | length) == (item.get('nexthops', []) | length)
    fail_msg: 'Malformed kernel gateway or next hops during FRONT discovery; route operation refused.'
  loop: '{{ bind_front_gateway_kernel_value | from_json if bind_front_gateway_kernel_value is string else bind_front_gateway_kernel_value }}'

- name: Reconcile persistent active and default-route FRONT gateways
  ansible.builtin.set_fact:
    bind_front_gateway_observation_json: >-
      {%- set ns = namespace(candidates=[], errors=[], defaults=[]) -%}
      {%- set profile = bind_front_gateway_profile_value | trim -%}
      {%- set active = bind_front_gateway_active_value | trim -%}
      {%- for value in [profile, active] -%}
        {%- if value not in ['', '--'] -%}
          {%- set ns.candidates = ns.candidates + [value] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for route in (bind_front_gateway_kernel_value | from_json if bind_front_gateway_kernel_value is string else bind_front_gateway_kernel_value) -%}
        {%- if route.get('dst', 'default') in ['default', '0.0.0.0/0'] -%}
          {%- set row = namespace(front=route.get('dev') == bind_front_gateway_device) -%}
          {%- for hop in route.get('nexthops', []) -%}
            {%- if hop.get('dev') == bind_front_gateway_device -%}{%- set row.front = true -%}{%- endif -%}
          {%- endfor -%}
          {%- if row.front -%}
            {%- if route.get('type', 'unicast') != 'unicast' or 'nexthops' in route or 'nhid' in route or not route.get('gateway') or route.get('flags', []) -%}
              {%- set ns.errors = ns.errors + ['Unsupported or incomplete FRONT default route'] -%}
            {%- else -%}
              {%- set ns.defaults = ns.defaults + [route.gateway] -%}
              {%- set ns.candidates = ns.candidates + [route.gateway] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'candidates': ns.candidates | unique | list, 'errors': ns.errors,
          'profile': profile, 'active': active, 'defaults': ns.defaults | unique | list} | to_json }}

- name: Retain structured FRONT gateway observations
  ansible.builtin.set_fact:
    bind_front_gateway_observation: '{{ bind_front_gateway_observation_json | from_json if bind_front_gateway_observation_json is string else bind_front_gateway_observation_json }}'

- name: Require one consistent existing FRONT IPv4 gateway
  ansible.builtin.assert:
    that:
      - bind_front_gateway_observation.errors | length == 0
      - bind_front_gateway_observation.candidates | length == 1
    fail_msg: >-
      Cannot identify one consistent FRONT gateway on {{ bind_front_gateway_device }}:
      {{ bind_front_gateway_observation_json }}.
      FRONT gateway changed since planning, is missing, ambiguous or contradictory.
      No default gateway from BACK/ADM or arbitrary destination next hop is used.

- name: Retain the reconciled FRONT gateway
  ansible.builtin.set_fact:
    bind_front_gateway: '{{ bind_front_gateway_observation.candidates[0] }}'

- name: Require a single literal IPv4 gateway without prefixes or extra lines
  ansible.builtin.assert:
    that:
      - bind_front_gateway is string
      - bind_front_gateway == bind_front_gateway_observation.candidates[0]
      - bind_front_gateway is match('^(0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]{0,2})$')
    fail_msg: 'Invalid FRONT gateway value {{ bind_front_gateway | to_json }}; route operation refused.'

- name: Check FRONT gateway octet bounds with the shared IPv4 validator
  ansible.builtin.import_tasks: '{{ role_path }}/tasks/tasks.d/deploy/front_routes_ipv4.yml'
  vars:
    bind_front_ipv4_context: 'reconciled FRONT gateway'
    bind_front_ipv4_values: '{{ [bind_front_gateway] | to_json }}'
