---
# named and the private renewal units are stopped by the parent rescue first.
# Recheck every target before the first mutation: file(state=absent) otherwise
# recursively removes a replacement directory, including unrelated contents.
- name: Inspect current runtime targets before rollback writes
  ansible.builtin.stat:
    path: '{{ item.item }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ (bind_runtime_files_before | default({})).get("results", []) }}'
  register: bind_runtime_restore_targets

- name: Refuse unsafe replacement runtime files during rollback
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or (item.stat.isreg | default(false))
      - not item.stat.exists or item.stat.uid == 0
      - not item.stat.exists or (item.stat.nlink | default(0) | int) == 1
      - not item.stat.exists or item.stat.mode is match('^0[0-7][0145][0145]$')
      - not item.stat.exists or (item.stat.size | int) <= 1048576
    fail_msg: 'Runtime rollback refuses an unsafe replacement; preserve it and inspect the snapshot before manual recovery.'
  loop: '{{ bind_runtime_restore_targets.results }}'
  loop_control:
    label: '{{ item.item.item }}'

- name: Inspect runtime parent directories before rollback writes
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ (bind_runtime_files_before | default({})).get("results", []) | map(attribute="item") | map("dirname") | unique | list }}'
  register: bind_runtime_restore_parents

- name: Refuse unsafe runtime parent directories during rollback
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not item.stat.exists or item.stat.uid == 0
      - not item.stat.exists or item.stat.mode is match('^0[0-7][0145][0145]$')
    fail_msg: 'Runtime rollback requires absent or root-owned, non-writable real parent directories.'
  loop: '{{ bind_runtime_restore_parents.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Remove runtime files that were absent before the failed deployment
  ansible.builtin.file:
    path: '{{ item.item }}'
    state: absent
  loop: '{{ (bind_runtime_files_before | default({})).get("results", []) }}'
  when: not item.stat.exists

- name: Restore the exact pre-deployment runtime files and permissions
  ansible.builtin.copy:
    dest: '{{ item.item.item }}'
    content: '{{ item.content | b64decode }}'
    owner: '{{ item.item.stat.uid }}'
    group: '{{ item.item.stat.gid }}'
    mode: '{{ item.item.stat.mode }}'
  loop: '{{ (bind_runtime_content_before | default({})).get("results", []) }}'
  when: not (item.skipped | default(false))
  no_log: true

- name: Reload the restored named runtime definitions
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restore the previous DNSSEC timer enablement
  ansible.builtin.systemd:
    name: named-private-dnssec.timer
    enabled: '{{ bind_dnssec_timer_enabled_before.stdout | trim == "enabled" }}'
  when:
    - (bind_runtime_files_before | default({})).get('results', []) | length > 0
    - bind_runtime_files_before.results[-1].stat.exists
