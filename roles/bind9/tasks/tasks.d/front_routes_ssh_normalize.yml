---
# Shared pure IPv4/mapped-IPv6 SSH normalization for planning and recovery.
- name: Normalize the real SSH peer without a custom filter
  ansible.builtin.set_fact:
    bind_front_ssh_ipv4: >-
      {%- set value = bind_front_ssh_client | lower -%}
      {%- if value is match('^::ffff:([0-9]{1,3}\\.){3}[0-9]{1,3}$') -%}
        {{ value.split('::ffff:')[-1] }}
      {%- elif value is match('^::ffff:[0-9a-f]{1,4}:[0-9a-f]{1,4}$') -%}
        {%- set tail = value.split('::ffff:')[-1] -%}
        {%- set parts = tail.split(':') -%}
        {%- set high = parts[0] | int(base=16) -%}{%- set low = parts[1] | int(base=16) -%}
        {{ [high//256, high%256, low//256, low%256] | join('.') }}
      {%- elif ':' in value -%}{{ '' }}
      {%- else -%}{{ value }}{%- endif -%}

