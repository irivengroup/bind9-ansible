---
- name: Derive local DNS peer addresses from inventory
  ansible.builtin.import_tasks: tasks.d/site_peers.yml
  tags: [always]

- name: Provision shared site TSIG on the controller
  ansible.builtin.import_tasks: tasks.d/tsig.yml
  tags: [deploy, configure]

- name: Generate reverse zones and PTR records from authoritative addresses
  ansible.builtin.set_fact:
    bind_generated_reverse_zones: "{{ bind_authoritative_zones | automatic_reverse_zones }}"
  tags: [always]

- name: Combine direct and automatically generated reverse zones
  ansible.builtin.set_fact:
    bind_managed_zones: "{{ bind_authoritative_zones + bind_generated_reverse_zones }}"
  tags: [always]

- name: Validate named inputs
  ansible.builtin.import_tasks: tasks.d/validate.yml
  tags: [deploy, preflight]

- name: Reject unsafe filesystem paths
  ansible.builtin.import_tasks: tasks.d/path_safety.yml
  tags: [deploy, preflight]

- name: Recover an explicitly requested interrupted FRONT operation
  ansible.builtin.import_tasks: tasks.d/front_routes_recover.yml
  tags: [never, routes-recover]

- name: Install dependencies before DNS checks require dig on a fresh secondary
  ansible.builtin.import_tasks: tasks.d/packages.yml
  tags: [deploy, install]

- name: Verify local primary before secondary deployment
  ansible.builtin.import_tasks: tasks.d/primary_readiness.yml
  tags: [deploy, preflight]
  when: "bind_secondary_group in group_names and ((bind_managed_zones) | length > 0)"

- name: Verify distribution-owned localhost zone files
  ansible.builtin.import_tasks: tasks.d/native_loopback.yml
  tags: [deploy, validate]

- name: Determine whether routes belong to a complete DNS deployment
  ansible.builtin.set_fact:
    bind_front_routes_defer_commit: '{{ "all" in ansible_run_tags or "deploy" in ansible_run_tags }}'
    bind_front_route_transaction_pending: false
    bind_front_route_rollback_attempted: false
  tags: [deploy, routes]

- name: Add only return routes when explicitly running the routes tag
  ansible.builtin.import_tasks: tasks.d/front_return_routes.yml
  tags: [deploy, routes]
  when:
    - bind_frontend_clients | length > 0
    - not (bind_front_routes_defer_commit | bool)

- name: Back up full BIND configuration before changes
  ansible.builtin.import_tasks: tasks.d/migration.yml
  tags: [deploy, backup]

- name: Prepare managed directories
  ansible.builtin.import_tasks: tasks.d/directories.yml
  tags: [deploy, configure]

- name: Find existing reverse zone files before deployment
  ansible.builtin.find:
    paths: /var/named/zones
    patterns:
      - '*.in-addr.arpa.zone'
      - '*.ip6.arpa.zone'
    contains: '^; Bind9-Ansible-MANAGED-REVERSE$'
    # Omit read_whole_file for older Ansible; contains already scans line by line.
  register: bind_existing_reverse_files
  when: "bind_primary_group in group_names"
  tags: [deploy]

- name: Apply DNS changes with rollback on failure
  block:
    - name: Add return routes as part of the protected DNS deployment
      ansible.builtin.import_tasks: tasks.d/front_return_routes.yml
      tags: [deploy]
      when:
        - bind_frontend_clients | length > 0
        - bind_front_routes_defer_commit | default(false) | bool

    - name: Install canonical named.conf
      ansible.builtin.import_tasks: tasks.d/configuration.yml
      tags: [deploy, configure]

    - name: Install authoritative zone files
      ansible.builtin.import_tasks: tasks.d/zones.yml
      tags: [deploy, configure, zones, records]

    - name: Configure SELinux contexts
      ansible.builtin.import_tasks: tasks.d/security.yml
      tags: [deploy, configure]

    - name: Validate BIND and zones
      ansible.builtin.import_tasks: tasks.d/verify.yml
      tags: [deploy, validate]

    - name: Start or reload BIND
      ansible.builtin.import_tasks: tasks.d/service.yml
      tags: [deploy, services]

    - name: Verify DNS queries and SOA consistency
      ansible.builtin.import_tasks: tasks.d/health.yml
      tags: [deploy, health]

    - name: Verify pending return routes after successful DNS health checks
      ansible.builtin.import_tasks: tasks.d/front_routes_verify.yml
      tags: [deploy]
      when: bind_front_route_transaction_pending | default(false) | bool

    - name: Commit return routes after successful DNS deployment
      ansible.builtin.import_tasks: tasks.d/front_routes_commit.yml
      tags: [deploy]
      when: bind_front_route_transaction_pending | default(false) | bool

  rescue:
    - name: Remove routes created by the failed DNS deployment
      block:
        - name: Roll back owned FRONT route additions
          # Evaluate the ownership guard once: a static import would reevaluate
          # it after the helper sets rollback_attempted, skipping its removals.
          ansible.builtin.include_tasks:
            file: '{{ role_path }}/tasks/tasks.d/front_routes_rollback.yml'
            apply:
              tags: [deploy]
          when:
            - bind_front_route_transaction_pending | default(false) | bool
            - not (bind_front_route_rollback_attempted | default(false) | bool)
      rescue:
        # Continue the existing DNS restoration, but surface the incomplete
        # network rollback in the final fatal error and retain its journal.
        - name: Record an incomplete FRONT rollback without masking it
          ansible.builtin.set_fact:
            bind_front_route_rollback_error: '{{ ansible_failed_result.msg | default("FRONT rollback failed; inspect the recovery journal") }}'
      tags: [deploy]

    - name: Restore the pre-deployment BIND backup
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/bind-configtool
          - restore
          - --root
          - "{{ bind_backup_root }}"
          - --archive
          - "{{ bind_recovery_archive | basename }}"
      register: bind_rollback
      tags: [deploy]
      changed_when: true

    - name: Restart restored BIND configuration
      ansible.builtin.systemd:
        name: named
        state: restarted
        daemon_reload: true
      when: bind_rollback is succeeded
      tags: [deploy]

    - name: Stop deployment after rollback
      ansible.builtin.fail:
        msg: >-
          named deployment failed; managed files restored. Inspect service and logs.
          {{ ('FRONT rollback incomplete: ' ~
          (bind_front_route_rollback_error | default('see the failed route task')) ~
          '. Recovery journal retained.')
          if (bind_front_route_transaction_pending | default(false) | bool) else '' }}
      tags: [deploy]


- name: Configure periodic DNS health monitoring
  ansible.builtin.import_tasks: tasks.d/monitoring.yml
  tags: [monitor]
  when: bind_monitoring_enabled | bool
