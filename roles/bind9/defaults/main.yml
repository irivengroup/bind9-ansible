---
bind_frontend_clients: []
bind_backend_clients: []
bind_forward_zones: []
bind_authoritative_zones: []
bind_backup_root: /var/backups/Bind9-Ansible/bind
bind_monitoring_enabled: false

# Metric for newly added specific FRONT routes; existing routes keep theirs.
bind_front_route_metric: 100

# Inventory role group names are configurable for reuse across projects.
bind_primary_group: dns_primary
bind_secondary_group: dns_secondary
