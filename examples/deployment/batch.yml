# One immutable resource list for a fresh deployment.
# Documentation addresses must be adapted to reachable upstreams.
bind_resources_deploy:
  resource: batch
  action: '{{ bind_deploy_batch_action | default("create") }}'
  operations:
    - resource: option
      action: update
      name: max-cache-size
      value: 128m
    - resource: acl
      action: create
      name: monitoring
      value: '192.0.2.40;'
    - resource: logging
      action: update
      name: logging
      value: |
        channel operational {
            file "/var/log/named/operational.log" versions 5 size 10m;
            severity info;
            print-time yes;
        };
        category default { operational; };
        category security { operational; };
        category queries { null; };
    - resource: zone
      action: create
      name: service.example.test
      kind: authoritative
      ttl: 300
      serial: 1
    - resource: record
      action: create
      zone: service.example.test
      name: app
      type: A
      ttl: 300
      values: ['192.0.2.80', '192.0.2.81']
    - resource: record
      action: create
      zone: service.example.test
      name: description
      type: TXT
      ttl: 300
      values: ['"service de demonstration"']
    - resource: zone
      action: create
      name: private.example.test
      kind: forward
      policy: only
      dnssec_validate: false
      forwarders:
        - address: 10.11.0.53
          port: 53
        - address: 10.11.0.54
          port: 53
