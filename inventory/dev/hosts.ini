# Voici les commandes à exécuter après déploiement. Les adresses et domaines ci-dessous viennent de l’inventaire d’exemple prod/site1 : adaptez-les à votre configuration réelle.
# Depuis le contrôleur Ansible, à la racine du projet :
# ansible-playbook -i inventory/prod/hosts.ini playbooks/bind9-deploy.yml \
#   --limit site1 --tags validate,health
# Cette commande vérifie la configuration, les zones, le loopback, les serials SOA et les forwarders.
# Sur chaque serveur DNS, vérifier la configuration, le service et l’écoute :
# sudo named-checkconf -z /etc/named.conf
# sudo systemctl is-active named
# sudo ss -luntp 'sport = :53'
# Attendu : aucune erreur de configuration, service active, écoute UDP/TCP sur 127.0.0.1 et les IP FRONT/BACK locales.
# Tester le loopback en UDP et TCP, sur chaque serveur :
# for transport in +notcp +tcp; do
#   dig -b 127.0.0.1 @127.0.0.1 localhost A \
#     "$transport" +norecurse +time=3 +tries=1 +noall +comments +answer
# 
#   dig -b 127.0.0.1 @127.0.0.1 -x 127.0.0.1 \
#     "$transport" +norecurse +time=3 +tries=1 +noall +comments +answer
# done
# Attendu : status: NOERROR, drapeau aa, adresse 127.0.0.1 et PTR localhost..
# Depuis un client FRONT autorisé, tester les deux serveurs. Ici, le client possède l’adresse 198.51.100.10 :
# for serveur in 192.0.2.11 192.0.2.12; do
#   for transport in +notcp +tcp; do
#     dig -b 198.51.100.10 @"$serveur" app.site1.prod.example.test A \
#       "$transport" +norecurse +time=3 +tries=1 +noall +comments +answer
# 
#     dig -b 198.51.100.10 @"$serveur" -x 192.0.2.101 \
#       "$transport" +norecurse +time=3 +tries=1 +noall +comments +answer
#   done
# done
# Attendu : NOERROR, aa, A 192.0.2.101 et PTR app.site1.prod.example.test.. L’adresse donnée à -b doit réellement appartenir au client ; cette option ne permet pas d’usurper une source. Manuel dig.
# Depuis le primaire, comparer les SOA des deux pairs sur BACK :
# dig -b 10.20.1.11 @10.20.1.11 site1.prod.example.test SOA \
#   +norecurse +noall +comments +answer
# 
# dig -b 10.20.1.11 @10.20.1.12 site1.prod.example.test SOA \
#   +norecurse +noall +comments +answer
# Attendu : NOERROR, aa et le même serial SOA sur les deux serveurs.
# Sur chaque serveur, vérifier le forwarding privé :
# for transport in +notcp +tcp; do
#   dig -b 127.0.0.1 @127.0.0.1 corp.site1.prod.example.test SOA \
#     "$transport" +recurse +time=3 +tries=1 +noall +comments +answer
# done
# Attendu : NOERROR et une SOA du suffixe demandé. Ici, conserver la récursion : +norecurse désactive la demande récursive nécessaire au forwarding. Manuel dig.
# Vérifier également le blocage des domaines non déclarés par votre racine privée :
# dig -b 127.0.0.1 @127.0.0.1 www.example.org A \
#   +recurse +time=3 +tries=1 +noall +comments +answer +authority
# Attendu dans cette configuration : NXDOMAIN.
# Sur chaque serveur, vérifier la route de retour vers le client FRONT :
# ip -4 route get 198.51.100.10 from 192.0.2.11
# Sur le secondaire, remplacer 192.0.2.11 par 192.0.2.12. Attendu : interface FRONT et passerelle FRONT lorsque ce client nécessite une route via cette passerelle.
# Depuis le client FRONT, vérifier qu’un transfert non signé est refusé :
# dig -b 198.51.100.10 @192.0.2.11 site1.prod.example.test AXFR \
#   +time=3 +tries=1
# Aucune donnée de zone ne doit être transférée. Une sortie vide, un timeout ou Transfer failed seul ne prouvent pas un refus DNS explicite.
# En cas d’échec :
# sudo journalctl -u named -n 100 --no-pager
# sudo ausearch -m AVC -ts recent
# Contrôles sur vos serveurs : NON EXÉCUTÉ, faute d’accès aux cibles.