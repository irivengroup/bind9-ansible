---
# Modèle fictif multi-interface, identique sur les deux serveurs du site.
# DNS : ens256 = FRONT, ens224 = BACK ; ADMIN utilise ansible_host.
# Adapter les noms aux interfaces réelles sans changer leur rôle.
# Pour une interface ou une seule écoute, utiliser la paire adaptée
# de examples/interfaces/ ; ne pas cumuler plusieurs scénarios.
ansible_host: 10.11.1.12
bind_listen_interfaces:
  - name: ens256
    ipaddress: 192.0.2.12
    scope: front
  - name: ens224
    ipaddress: 10.21.1.12
    scope: back
