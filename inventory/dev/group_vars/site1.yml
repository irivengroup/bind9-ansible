---
bind_site_name: site1
bind_tsig_key_name: dev-site1-transfer
bind_tsig_algorithm: hmac-sha256
bind_tsig_secret_file: "{{ lookup('env', 'HOME') }}/.local/share/bind9-ansible/tsig/dev/site1.key"

bind_internal_clients: []
bind_cloud_clients:
  - 198.51.100.0/24

bind_forward_zones:
  - domain: corp.site1.dev.example.test
    policy: only
    dnssec_validate: false
    forwarders:
      - address: 10.11.0.53
        port: 53

bind_authoritative_zones:
  - domain: site1.dev.example.test
    ttl: 300
    serial: 2026101401
    records:
      - name: app
        type: A
        value: 192.0.2.101
