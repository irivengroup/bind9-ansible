---
bind_site_name: site1
bind_tsig_key_name: prod-site1-transfer
bind_tsig_algorithm: hmac-sha256
bind_tsig_secret_file: "{{ lookup('env', 'HOME') }}/.local/share/bind9-ansible/tsig/prod/site1.key"

bind_trusted_networks:
  cloud_clients:
    - 198.51.100.0/24
  internal_clients: []

bind_resources_deploy:
  resource: batch
  action: create
  operations:
  - resource: zone
    action: create
    kind: authoritative
    zone:
      domain: site1.prod.example.test
      ttl: 300
      serial: 2026101401
      records:
      - name: app
        type: A
        value: 192.0.2.101
  - resource: zone
    action: create
    kind: forward
    zone:
      domain: corp.site1.prod.example.test
      policy: only
      dnssec_validate: false
      forwarders:
      - address: 10.11.0.53
        port: 53
