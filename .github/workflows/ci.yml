name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            ansible-version: '2.9.27'
            jinja-version: '3.0.3'
          - python-version: '3.8'
            ansible-version: '2.9.27'
            jinja-version: '2.10.3'
          - python-version: '3.8'
            ansible-version: '2.13.13'
          - python-version: '3.9'
            ansible-version: '2.14.18'
          - python-version: '3.10'
            ansible-version: '2.16.14'
          - python-version: '3.11'
            ansible-version: '2.16.14'
          - python-version: '3.12'
            ansible-version: '2.16.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: |
          if [ '${{ matrix.ansible-version }}' = '2.9.27' ]; then
            python -m pip install 'ansible==2.9.27' 'jinja2==${{ matrix.jinja-version }}' 'markupsafe==2.0.1' pytest pyyaml
          else
            python -m pip install 'ansible-core==${{ matrix.ansible-version }}' pytest pyyaml
          fi
      - name: Ansible syntax check
        run: |
          ansible-playbook -i inventory/prod/hosts.ini playbooks/bind9-deploy.yml --syntax-check
          ansible-playbook -i inventory/prod/hosts.ini playbooks/bind9-management.yml --syntax-check
      - name: Detect unused Python imports and undefined names
        run: |
          python -m pip install 'pyflakes==3.2.0'
          python -m pyflakes roles/bind9/filter_plugins roles/bind9/files roles/bind9/module_utils roles/bind9/library tests
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Compile Python sources
        run: python -m compileall -q roles/bind9/files roles/bind9/filter_plugins roles/bind9/module_utils roles/bind9/library tests && python -m py_compile roles/bind9/files/reverse-serial.py roles/bind9/files/tsig-secret.py
      - name: Check shell syntax
        run: |
          for script in roles/bind9/files/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Analyze all shell sources with pinned ShellCheck
        if: matrix.ansible-version == '2.9.27' && matrix.jinja-version == '2.10.3'
        run: |
          docker run --rm --network none --read-only \
            -v "$PWD:/mnt:ro" --workdir /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --norc --shell=bash roles/bind9/files/*.sh tests/*.sh
      - name: Native route task workflows on legacy Ansible
        if: matrix.ansible-version == '2.9.27'
        run: sudo --preserve-env=PATH "$(command -v python)" -m pytest -q tests/test_front_routes_ansible.py tests/test_front_route_hardening_ansible.py
      - name: Targeted management, deployment seal and transport on legacy Ansible
        if: matrix.ansible-version == '2.9.27'
        run: |
          python -m pip install 'coverage==7.6.1'
          sudo --preserve-env=PATH "$(command -v python)" -m coverage run --include='*/roles/bind9/module_utils/bind9_management.py' -m pytest -q tests/test_management.py tests/test_management_refusals.py tests/test_management_hardening.py tests/test_management_ansible.py tests/test_management_batch.py tests/test_management_batch_ansible.py tests/test_management_list.py tests/test_management_live_integrity.py tests/test_management_io_safety.py tests/test_deployment_contract.py tests/test_deployment_lock_ansible.py tests/test_operation_lock_policy.py tests/test_operation_lock_bypass_ansible.py tests/test_routes_deployed_entry_ansible.py tests/test_operation_resilience.py
          python -m coverage report --fail-under=98
      - name: Optional DNSSEC lifecycle workflows on legacy Ansible
        if: matrix.ansible-version == '2.9.27'
        run: sudo --preserve-env=PATH "$(command -v python)" -m pytest -q tests/test_dnssec_workflows.py
      - name: Backup and restore security in isolated mount namespaces
        if: matrix.ansible-version == '2.9.27'
        run: sudo --preserve-env=PATH BIND_TEST_REQUIRE_MOUNT_NS=1 "$(command -v python)" -m pytest -q tests/test_configtool_workflows.py
      - name: Preflight all delivered inventories on legacy Ansible
        if: matrix.ansible-version == '2.9.27'
        run: python tests/integration_preflight.py
      - name: DNS and native route task coverage
        if: matrix.ansible-version == '2.9.27'
        run: |
          python -m pip install 'coverage==7.6.1'
          sudo --preserve-env=PATH "$(command -v python)" -m coverage run --include='*/roles/bind9/filter_plugins/dns_topology.py,*/roles/bind9/filter_plugins/soa_health.py,*/roles/bind9/filter_plugins/client_acl.py,*/roles/bind9/files/bind-private-dnssec.py,*/roles/bind9/files/tsig-secret.py' -m pytest -q tests/test_native_front_routes.py tests/test_front_route_hardening.py tests/test_dns_topology.py tests/test_soa_health.py tests/test_dns_probe_hardening.py tests/test_security_remediation.py tests/test_private_dnssec.py tests/test_private_dnssec_hardening.py tests/test_global_review.py tests/test_tsig_hardening.py tests/test_tsig_provisioning.py
          python -m coverage report --fail-under=98
      - name: Analyze modified production Python code
        if: matrix.ansible-version == '2.9.27'
        run: |
          python -m pip install 'bandit==1.7.10'
          python -m bandit -q roles/bind9/filter_plugins/dns_topology.py roles/bind9/filter_plugins/soa_health.py roles/bind9/files/reverse-serial.py roles/bind9/filter_plugins/client_acl.py roles/bind9/files/bind-private-dnssec.py roles/bind9/files/tsig-secret.py roles/bind9/module_utils/bind9_management.py roles/bind9/library/bind9_manage.py
