name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    # Legacy Python builds are available for this supported, explicit runner.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            ansible-version: '2.9.27'
            jinja-version: '3.0.3'
          - python-version: '3.8'
            ansible-version: '2.9.27'
            jinja-version: '2.10.3'
          - python-version: '3.8'
            ansible-version: '2.13.13'
          - python-version: '3.9'
            ansible-version: '2.14.18'
          - python-version: '3.10'
            ansible-version: '2.16.19'
          - python-version: '3.11'
            ansible-version: '2.16.19'
          - python-version: '3.12'
            ansible-version: '2.16.19'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: |
          python -m pip install 'coverage==7.6.1'
          if [ '${{ matrix.ansible-version }}' = '2.9.27' ]; then
            python -m pip install 'ansible==2.9.27' 'jinja2==${{ matrix.jinja-version }}' 'markupsafe==2.0.1' pytest pyyaml
          else
            python -m pip install 'ansible-core==${{ matrix.ansible-version }}' pytest pyyaml
          fi
      - name: Ansible syntax check
        run: |
          ansible-playbook -i inventory/prod/hosts.ini playbooks/bind9-deploy.yml --syntax-check
          ansible-playbook -i inventory/prod/hosts.ini playbooks/bind9-management.yml --syntax-check
      - name: Install independent coverage observer dependency
        if: matrix.python-version == '3.11'
        run: |
          python -m pip --isolated install --only-binary=:all: --require-hashes -r tools/quality/requirements-qa.lock
      - name: Detect unused Python imports and undefined names
        run: |
          python -m pip install 'pyflakes==3.2.0'
          python -m pyflakes roles/bind9/filter_plugins roles/bind9/files roles/bind9/module_utils roles/bind9/library tests tools/quality
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Execute all FRONT gateway integration cases with real root
        run: |
          set -euo pipefail
          sudo --preserve-env=PATH "$(command -v python)" -m pytest -q \
            --junitxml="$RUNNER_TEMP/bind9-front-gateway-root.xml" tests/test_front_kernel_gateway.py tests/test_front_connected_aliases.py
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'bind9-front-gateway-root.xml'
          cases = list(ET.parse(str(report)).getroot().iter('testcase'))
          assert len(cases) == 58, 'All 43 gateway and 15 connected-alias integration cases are mandatory'
          assert all(case.find(tag) is None for case in cases for tag in ('failure', 'error', 'skipped')), 'No privileged FRONT case may be skipped or fail'
          PY
      - name: Compile Python sources
        run: python -m compileall -q roles/bind9/files roles/bind9/filter_plugins roles/bind9/module_utils roles/bind9/library tests && python -m py_compile roles/bind9/files/reverse-serial.py roles/bind9/files/tsig-secret.py
      - name: Check shell syntax
        run: |
          for script in roles/bind9/files/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Analyze all shell sources with pinned ShellCheck
        if: matrix.ansible-version == '2.9.27' && matrix.jinja-version == '2.10.3'
        run: |
          docker run --rm --network none --read-only \
            -v "$PWD:/mnt:ro" --workdir /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --norc --shell=bash roles/bind9/files/*.sh tests/*.sh
      - name: Native route task workflows on legacy Ansible
        if: matrix.ansible-version == '2.9.27'
        run: sudo --preserve-env=PATH "$(command -v python)" -m pytest -q tests/test_front_routes_ansible.py tests/test_front_route_hardening_ansible.py tests/test_front_route_recovery_hardening.py
      - name: Targeted management, deployment seal and transport on legacy Ansible
        if: matrix.ansible-version == '2.9.27'
        run: |
          sudo --preserve-env=PATH "$(command -v python)" -m coverage run --include='*/roles/bind9/module_utils/bind9_management.py' -m pytest -q tests/test_management.py tests/test_management_acl_logging.py tests/test_management_entry_contract.py tests/test_management_refusals.py tests/test_management_hardening.py tests/test_management_ansible.py tests/test_management_batch.py tests/test_management_batch_ansible.py tests/test_management_list.py tests/test_management_live_integrity.py tests/test_management_io_safety.py tests/test_management_coverage_boundaries.py tests/test_management_recovery_boundaries.py tests/test_management_observation_faults.py tests/test_management_publication_boundaries.py tests/test_dns_ascii_contract.py tests/test_project_review_regressions.py tests/test_deployment_contract.py tests/test_deployment_lock_ansible.py tests/test_operation_lock_policy.py tests/test_operation_lock_bypass_ansible.py tests/test_routes_deployed_entry_ansible.py tests/test_operation_resilience.py
          python -m coverage report --precision=4 --fail-under=99.99
      - name: Optional DNSSEC lifecycle workflows on legacy Ansible
        if: matrix.ansible-version == '2.9.27'
        run: sudo --preserve-env=PATH "$(command -v python)" -m pytest -q tests/test_dnssec_workflows.py
      - name: Preflight all delivered inventories on legacy Ansible
        if: matrix.ansible-version == '2.9.27'
        run: python tests/integration_preflight.py
      - name: DNS and native route task coverage
        if: matrix.ansible-version == '2.9.27'
        run: |
          sudo --preserve-env=PATH "$(command -v python)" -m coverage run --include='*/roles/bind9/filter_plugins/dns_topology.py,*/roles/bind9/filter_plugins/soa_health.py,*/roles/bind9/filter_plugins/client_acl.py,*/roles/bind9/files/bind-private-dnssec.py,*/roles/bind9/files/tsig-secret.py' -m pytest -q tests/test_native_front_routes.py tests/test_front_route_hardening.py tests/test_dns_topology.py tests/test_forwarder_local_endpoints.py tests/test_soa_health.py tests/test_dns_probe_hardening.py tests/test_security_remediation.py tests/test_private_dnssec.py tests/test_private_dnssec_hardening.py tests/test_private_dnssec_integrity.py tests/test_global_review.py tests/test_tsig_hardening.py tests/test_tsig_provisioning.py tests/test_tsig_publication_integrity.py tests/test_dns_ascii_contract.py tests/test_template_execution_contracts.py
          python -m coverage report --precision=4 --fail-under=99.99
      - name: Analyze modified production Python code
        if: matrix.ansible-version == '2.9.27'
        run: |
          python -m pip install 'bandit==1.7.10'
          python -m bandit -q -r roles/bind9
  five-metric-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the exact native interpreter source
        env:
          GNU_SOURCE: ${{ runner.temp }}/bind9-gnu-source
        run: |
          set -euo pipefail
          mkdir -m 0700 "$GNU_SOURCE"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 16777216 \
            https://ftp.gnu.org/gnu/bash/bash-5.2.37.tar.gz -o "$GNU_SOURCE/bash-5.2.37.tar.gz"
          printf '%s  %s\n' 9599b22ecd1d5787ad7d3b7bf0c59f312b3396d1e281175dd1f8a4014da621ff \
            "$GNU_SOURCE/bash-5.2.37.tar.gz" | sha256sum --check --strict -
      - name: Build the controller and the two isolated native-checker images
        run: |
          set -euo pipefail
          for target in controller native-checker native-public; do
            docker build --progress plain --target "$target" \
              --build-context "gnu-bash=$RUNNER_TEMP/bind9-gnu-source" \
              -f tools/quality/Dockerfile.qa -t "bind9-private-qa:$target" .
          done
      # Genuine BIND checks have separate roots: ordinary command fixtures
      # deliberately refuse images containing their own system target paths.
      - name: Load and verify the confined native QA mount policy
        run: |
          set -euo pipefail
          docker info --format '{{json .SecurityOptions}}' |
            python3 -c 'import json,sys; assert "name=apparmor" in json.load(sys.stdin), "Hosted native QA requires enforced AppArmor"'
          sudo apparmor_parser --replace --warn .github/native-qa.apparmor
          sudo grep -Fx 'bind9-qa-native (enforce)' /sys/kernel/security/apparmor/profiles
          # Verify both necessary mounts and a forbidden destination. Never
          # substitute an unconfined/privileged container for a policy failure.
          docker run --rm --network none --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=bind9-qa-native \
            --entrypoint /bin/bash bind9-private-qa:controller -euc '
              test "$(cat /proc/self/attr/current)" = "bind9-qa-native (enforce)"
              mount --bind /src /src
              mount -o remount,bind,ro /src
              python -c "import os; assert os.statvfs(\"/src\").f_flag & os.ST_RDONLY"
              mkdir -p /tmp/native-qa-mount-source /opt/native-qa-forbidden
              mount --bind /tmp/native-qa-mount-source /usr/sbin
              umount /usr/sbin
              mount --bind /tmp/native-qa-mount-source /var
              umount /var
              if mount --bind /tmp/native-qa-mount-source /opt/native-qa-forbidden; then
                echo "AppArmor accepted an unapproved mount target" >&2
                umount /opt/native-qa-forbidden
                exit 1
              fi
              unshare --mount --propagation private /bin/true
            '
      - name: Execute every collected test and merge all native cohorts before checking thresholds
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/bind9-five-metrics"
          campaign_step() {
            local image=$1 phase=$2 cohort=${3-} batch_size=${4-32}
            local -a native_environment=()
            if [[ $cohort == checker ]]; then
              native_environment=(-e BIND_MANAGEMENT_CHECKCONF=/usr/bin/named-checkconf)
            fi
            docker run --rm --network none --cap-add SYS_ADMIN \
              --security-opt apparmor=bind9-qa-native \
              --security-opt seccomp=unconfined \
              -e BIND9_NATIVE_STATE_LAB=1 -e BIND9_CANONICAL_BASH_LAB=1 \
              -e BIND9_NATIVE_SSH_LAB=1 -e BIND_TEST_REQUIRE_MOUNT_NS=1 \
              -e "BIND_CAMPAIGN_PHASE=$phase" -e "BIND_CAMPAIGN_COHORT=$cohort" \
              -e "BIND_CAMPAIGN_BATCH_SIZE=$batch_size" "${native_environment[@]}" \
              --mount "type=bind,src=$PWD,dst=/snapshot,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/bind9-five-metrics,dst=/evidence" \
              "bind9-private-qa:$image" /bin/bash -euc '
                test -z "$(find /src -mindepth 1 -maxdepth 1 -print -quit)"
                cp -a /snapshot/. /src/
                PYTHONPATH=/src/tools/quality python - <<"PY"
          from coverage_gate import CoverageGate
          origin, staged = CoverageGate("/snapshot"), CoverageGate("/src")
          assert origin.sources == staged.sources and origin.qa_sources == staged.qa_sources
          PY
                mount --bind /src /src
                mount -o remount,bind,ro /src
                python -c "import os; assert os.statvfs(\"/src\").f_flag & os.ST_RDONLY"
                if [[ $BIND_CAMPAIGN_PHASE == run ]]; then
                  exec python tools/quality/run_coverage_campaign.py run --root /src \
                    --output /evidence/coverage --cohort "$BIND_CAMPAIGN_COHORT" \
                    --batch-size "$BIND_CAMPAIGN_BATCH_SIZE"
                fi
                exec python tools/quality/run_coverage_campaign.py "$BIND_CAMPAIGN_PHASE" \
                  --root /src --output /evidence/coverage
              '
          }
          campaign_step controller plan
          campaign_step controller run main 32
          campaign_step native-checker run checker 8
          campaign_step native-public run public 2
          campaign_step controller merge
      - name: Export private evidence including incomplete or refused batches
        if: always()
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/bind9-five-metrics" ]; then
            sudo tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/bind9-five-metrics.tar.gz" bind9-five-metrics
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/bind9-five-metrics.tar.gz"
            chmod 0600 "$RUNNER_TEMP/bind9-five-metrics.tar.gz"
          fi
      - name: Retain source-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bind9-five-metrics
          path: ${{ runner.temp }}/bind9-five-metrics.tar.gz
          if-no-files-found: error
